<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>FitPulse · protótipo do diagnóstico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  /* Fundamentos: tinta (padrão) */
  --tinta:#0b0a08; --tinta-2:#0f0d0a; --superficie:#161310; --superficie-2:#1d1914; --solido:#242019;
  --marfim:#f5f1e8; --marfim-2:#cdc5b4; --fumaca:#8f8674;
  --linha:rgba(224,203,163,.14); --linha-2:rgba(233,214,177,.28);
  /* Materiais usados pelo app */
  --bronze:#a8c07a; --bronze-tinta:#0b0a08; --ouro:#e8ba52; --ouro-tinta:#0b0a08;
  --patina:#6ec6a2; --cobre:#d8895b; --perigo:#e25d5d;
  --veu:rgba(5,4,3,.72);
  /* Vozes */
  --voz-estrutura:Inter, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --voz-humana:Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
  --voz-maquina:"JetBrains Mono", "Cascadia Code", ui-monospace, monospace;
  /* Aliases semânticos (os componentes usam estes) */
  --ground:var(--tinta); --surface:var(--superficie); --paper:var(--superficie-2); --sunken:var(--tinta-2);
  --ink:var(--marfim); --ink-2:var(--marfim-2); --muted:var(--fumaca);
  --accent:var(--bronze); --accent-text:var(--bronze); --accent-ink:var(--bronze-tinta);
  --wash:color-mix(in oklab, var(--bronze) 13%, transparent);
  --rule:var(--linha); --rule-strong:var(--linha-2);
  --ok:var(--patina); --ok-wash:color-mix(in oklab, var(--patina) 14%, transparent);
  --warn:var(--cobre); --warn-wash:color-mix(in oklab, var(--cobre) 14%, transparent);
  --danger:var(--perigo); --danger-wash:color-mix(in oklab, var(--perigo) 14%, transparent);
  --t-12:.75rem; --t-14:.875rem; --t-16:1rem; --t-18:1.125rem; --t-24:1.5rem; --t-36:2.25rem; --t-56:3.5rem;
  --s-4:4px; --s-8:8px; --s-12:12px; --s-16:16px; --s-24:24px; --s-32:32px; --s-48:48px; --s-64:64px; --s-96:96px;
  --r-sm:6px; --r-md:10px; --r-lg:16px;
  --control:40px;
  --ease:cubic-bezier(.22,.61,.36,1); --fast:160ms; --dur:220ms;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --tinta:#f1ede3; --tinta-2:#e9e4d6; --superficie:#f9f6ee; --superficie-2:#fffdf7; --solido:#fffdf7;
  --marfim:#1c1710; --marfim-2:#4c4436; --fumaca:#7d7362;
  --linha:rgba(92,74,44,.14); --linha-2:rgba(92,74,44,.26);
  --bronze:#55692a; --bronze-tinta:#fffdf7; --ouro:#8a6512; --ouro-tinta:#fffdf7;
  --patina:#177a58; --cobre:#a55a30; --perigo:#bf3d47;
  --veu:rgba(28,23,16,.42);
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--tinta);color:var(--marfim);font-family:var(--voz-estrutura);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;scrollbar-color:var(--linha-2) var(--tinta)}
body{margin:0;min-height:100vh;background:var(--tinta);font-variant-numeric:tabular-nums;position:relative;isolation:isolate}
/* D-04 poeira: nebulosa no metal do app + fagulhas ouro/bronze, numa camada única */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(2px 2px at 78% 14%, var(--ouro) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 66% 22%, var(--bronze) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 88% 30%, var(--ouro) 50%, transparent 51%),
    radial-gradient(2px 2px at 58% 9%, var(--bronze) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 93% 8%, var(--bronze) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 71% 36%, var(--ouro) 50%, transparent 51%),
    radial-gradient(900px 460px at 80% -8%, color-mix(in oklab, var(--bronze) 15%, transparent), transparent 72%),
    radial-gradient(700px 380px at 6% 110%, color-mix(in oklab, var(--ouro) 6%, transparent), transparent 70%);
  animation:respira 8s ease-in-out infinite}
@keyframes respira{0%,100%{opacity:.62;filter:brightness(.82)}50%{opacity:1;filter:brightness(1.18)}}
:root[data-theme="light"] body::before{animation:none;opacity:.55}
::selection{background:var(--bronze);color:var(--bronze-tinta)}
input,select,textarea,button{font:inherit;color:inherit;caret-color:var(--bronze)}
:focus-visible{outline:2px solid var(--ouro);outline-offset:2px;border-radius:var(--r-sm)}
a{color:var(--bronze);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--linha-2);border-radius:10px}::-webkit-scrollbar-track{background:var(--tinta)}
h1,h2,h3{font-family:var(--voz-estrutura);font-weight:700;line-height:1.15;margin:0;color:var(--marfim);letter-spacing:-.02em;text-wrap:balance}
h1{font-size:var(--t-36);letter-spacing:-.03em}
h2{font-size:var(--t-24)}
h3{font-size:var(--t-18);font-weight:600;letter-spacing:-.01em}
p{margin:0;text-wrap:pretty}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.human{font-family:var(--voz-humana);font-style:italic;font-weight:400;color:var(--bronze);letter-spacing:0}
.mono,.tag,.meta-line{font-family:var(--voz-maquina)}
/* D-01 batuta */
.meta-line{display:flex;align-items:center;gap:10px;font-size:var(--t-12);font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--fumaca);margin-top:var(--s-8)}
.meta-line.accent{color:var(--bronze)}
.batuta::before{content:"";flex:none;display:inline-block;width:26px;height:2px;background:linear-gradient(90deg,transparent,currentColor);transform-origin:left;animation:batuta 360ms var(--ease) both}
@keyframes batuta{from{transform:scaleX(0)}}
/* D-02 pauta */
.pauta{position:relative;height:33px;margin:var(--s-48) 0;background:repeating-linear-gradient(to bottom,var(--linha) 0 1px,transparent 1px 8px)}
.pauta::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--bronze)}

/* Shell */
.proto-band{font-family:var(--voz-maquina);font-size:var(--t-12);letter-spacing:.08em;text-align:center;padding:6px var(--s-16);color:var(--marfim-2);background:var(--tinta-2);border-bottom:1px solid var(--linha)}
.top{position:sticky;top:0;z-index:20;padding:var(--s-12) var(--s-24) 0}
.top-in{max-width:1120px;margin-inline:auto;padding:0 var(--s-16);height:60px;display:flex;align-items:center;gap:var(--s-24);border:1px solid var(--linha);border-radius:var(--r-lg);background:color-mix(in oklab, var(--tinta) 82%, transparent);backdrop-filter:blur(10px) saturate(1.1)}
.brand{display:flex;align-items:center;gap:var(--s-12);text-decoration:none;color:var(--marfim)}
.brand-mark{width:34px;height:34px;border-radius:var(--r-md);border:1px solid var(--linha-2);display:grid;place-items:center;color:var(--bronze);background:var(--superficie)}
.brand-mark svg{width:20px;height:20px}
.brand-txt b{display:block;font-size:var(--t-18);font-weight:700;letter-spacing:-.03em;line-height:1.1}
.brand-txt span{display:block;font-family:var(--voz-maquina);font-size:var(--t-12);letter-spacing:.12em;text-transform:uppercase;color:var(--fumaca);line-height:1.2}
.nav{display:flex;gap:var(--s-4);flex:1;justify-content:center}
.nav a{padding:var(--s-8) var(--s-12);border-radius:var(--r-md);color:var(--marfim-2);text-decoration:none;font-size:var(--t-14);font-weight:500;position:relative;transition:color var(--fast) var(--ease)}
.nav a:hover{color:var(--marfim)}
.nav a[aria-current="page"]{color:var(--marfim)}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:var(--s-12);right:var(--s-12);bottom:2px;height:2px;border-radius:2px;background:var(--bronze)}
.mode-chip{font-family:var(--voz-maquina);font-size:var(--t-12);letter-spacing:.1em;text-transform:uppercase;color:var(--fumaca);white-space:nowrap}
.icon-btn{width:var(--control);height:var(--control);display:inline-grid;place-items:center;border-radius:var(--r-md);border:1px solid var(--linha);background:var(--superficie);cursor:pointer;color:var(--marfim);transition:border-color var(--fast) var(--ease)}
.icon-btn:hover{border-color:var(--linha-2)}
.icon-btn svg{width:18px;height:18px}
main{max-width:1120px;margin:0 auto;padding:var(--s-48) var(--s-24) var(--s-96);container-type:inline-size}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--s-16);margin-bottom:var(--s-24)}
.page-head .sub{color:var(--fumaca);font-size:var(--t-14);margin-top:var(--s-8)}
.crumb{font-size:var(--t-14);margin-bottom:var(--s-16)}
.crumb a{color:var(--fumaca)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-8);min-height:var(--control);padding:0 var(--s-16);border-radius:var(--r-md);border:1px solid var(--linha-2);background:transparent;color:var(--marfim);font-size:var(--t-14);font-weight:600;cursor:pointer;text-decoration:none;transition:border-color var(--fast) var(--ease),background-color var(--fast) var(--ease),transform var(--fast) var(--ease)}
.btn:hover{border-color:var(--marfim-2);background:var(--superficie)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--bronze);border-color:var(--bronze);color:var(--bronze-tinta)}
.btn.primary:hover{background:color-mix(in oklab, var(--bronze) 86%, var(--marfim))}
.btn.gate{background:var(--ouro);border-color:var(--ouro);color:var(--ouro-tinta)}
.btn.gate:hover{background:color-mix(in oklab, var(--ouro) 86%, var(--marfim))}
.btn.danger{background:var(--perigo);border-color:var(--perigo);color:var(--tinta)}
:root[data-theme="light"] .btn.danger{color:var(--superficie-2)}
.btn.ghost{border-color:transparent}
.btn.ghost:hover{background:var(--superficie);border-color:var(--linha)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn svg{width:18px;height:18px;flex:none}
.link-btn{background:none;border:0;padding:0;color:var(--bronze);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:inherit}

/* Escada com trava (assinatura) */
.plate-wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:var(--s-48);align-items:center}
.plate{margin:0;padding:var(--s-32) var(--s-24) var(--s-16);background:color-mix(in oklab, var(--superficie) 88%, transparent);border:1px solid var(--linha-2);border-radius:var(--r-lg);position:relative}
.plate::before{content:"";position:absolute;inset:6px;border:1px solid var(--linha);border-radius:12px;pointer-events:none}
.steps{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s-12);height:210px;align-items:end;padding:0 var(--s-8)}
.step{position:relative;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.riser{height:var(--h);border-radius:var(--r-sm) var(--r-sm) 0 0;background:var(--superficie-2);border:1px solid var(--linha);border-bottom:0;position:relative;transition:background-color var(--dur) var(--ease)}
.step.is-below .riser{background:color-mix(in oklab, var(--bronze) 22%, var(--superficie-2))}
.step.is-current .riser{background:var(--bronze);border-color:var(--bronze)}
.step.is-trail .riser{background:repeating-linear-gradient(135deg, color-mix(in oklab, var(--bronze) 20%, transparent) 0 6px, transparent 6px 12px);border:1px dashed var(--linha-2);border-bottom:0}
a.step:hover .riser{border-color:var(--bronze)}
.here{position:absolute;left:50%;transform:translateX(-50%);top:-32px;background:var(--superficie);padding:2px 6px;border-radius:var(--r-sm);white-space:nowrap;font-family:var(--voz-maquina);font-size:var(--t-12);letter-spacing:.08em;text-transform:uppercase;color:var(--bronze);display:flex;align-items:center;gap:4px}
.trail-tag{position:absolute;left:50%;transform:translateX(-50%);top:-28px;background:var(--superficie);padding:2px 6px;border-radius:var(--r-sm);white-space:nowrap;font-family:var(--voz-maquina);font-size:var(--t-12);letter-spacing:.08em;text-transform:uppercase;color:var(--fumaca)}
.lock{position:absolute;left:50%;transform:translateX(-50%);top:-20px;width:40px;height:40px;border-radius:50%;background:var(--solido);border:1px solid var(--linha-2);display:grid;place-items:center;color:var(--marfim)}
.lock svg{width:18px;height:18px}
.pauta-mini{position:relative;height:25px;margin:0 var(--s-8);background:repeating-linear-gradient(to bottom,var(--linha-2) 0 1px,transparent 1px 6px)}
.pauta-mini::before{content:"";position:absolute;left:-8px;top:0;bottom:0;width:2px;background:var(--bronze)}
.step-labels{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s-12);padding:var(--s-8) var(--s-8) 0}
.step-labels div{font-size:var(--t-14);color:var(--fumaca);line-height:1.3}
.step-labels b{display:block;font-weight:600;color:var(--marfim-2)}
.step-labels .cur b{color:var(--bronze)}
.plate-cap{margin-top:var(--s-12);padding-top:var(--s-12);border-top:1px solid var(--linha);display:flex;justify-content:space-between;gap:var(--s-12);flex-wrap:wrap}
.plate-cap .meta-line{margin:0}
.stage-title{font-size:clamp(2.5rem, 2rem + 2.2vw, 3.5rem);line-height:1.02;font-weight:700;letter-spacing:-.035em}
.stage-why{margin-top:var(--s-16);font-size:var(--t-18);color:var(--marfim-2);max-width:38ch}
.stage-why b{color:var(--marfim);font-weight:600}
.trava{margin-top:var(--s-24);display:flex;gap:var(--s-16);align-items:flex-start;padding:var(--s-16) var(--s-16) var(--s-16) var(--s-16);background:var(--superficie);border:1px solid var(--linha);border-radius:var(--r-lg)}
.trava .lk{width:36px;height:36px;border-radius:50%;background:var(--solido);border:1px solid var(--linha-2);color:var(--bronze);display:grid;place-items:center;flex:none}
.trava .lk svg{width:16px;height:16px}
.trava p{font-size:var(--t-16);color:var(--marfim-2)}
.trava .human{font-size:var(--t-18);display:block;margin-top:2px;line-height:1.35}
.trava .meta{display:block;font-family:var(--voz-maquina);font-size:var(--t-12);letter-spacing:.06em;color:var(--fumaca);margin-top:var(--s-8)}

/* Layout */
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:var(--s-48)}
.cols.three{grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-32)}
.section-title{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s-12);margin-bottom:var(--s-16)}
.section-title a,.section-title button{font-size:var(--t-14);white-space:nowrap}
.rule-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--linha)}
.rule-list>li{padding:var(--s-16) 0;border-bottom:1px solid var(--linha)}
.actions-list{counter-reset:a}
.actions-list li{display:grid;grid-template-columns:44px 1fr;gap:var(--s-12)}
.actions-list li::before{counter-increment:a;content:counter(a, decimal-leading-zero);font-family:var(--voz-maquina);font-size:var(--t-14);font-weight:500;color:var(--bronze);padding-top:3px}
.actions-list b{display:block;font-weight:600;color:var(--marfim)}
.actions-list p{font-size:var(--t-14);color:var(--marfim-2);margin-top:2px}
.actions-list .how{color:var(--fumaca)}
.attn{display:flex;gap:var(--s-12);align-items:flex-start;padding:var(--s-16);border-radius:var(--r-lg);background:var(--warn-wash);border:1px solid color-mix(in oklab, var(--cobre) 35%, transparent)}
.attn svg{width:20px;height:20px;flex:none;color:var(--cobre);margin-top:2px}
.attn b{display:block}
.attn p{font-size:var(--t-14);color:var(--marfim-2)}
.attn .btn{margin-top:var(--s-12)}
.kpi{padding:var(--s-16) 0;border-bottom:1px solid var(--linha)}
.kpi .num{font-family:var(--voz-maquina);font-size:var(--t-36);font-weight:500;line-height:1.15;letter-spacing:-.02em;color:var(--marfim)}
.kpi .lbl{font-size:var(--t-14);color:var(--fumaca)}
.spark{display:block;width:100%;height:56px;margin-top:var(--s-8)}
.spark path{stroke:var(--bronze)}.spark circle{fill:var(--superficie-2);stroke:var(--bronze)}.spark line{stroke:var(--linha)}
.note{font-size:var(--t-14);color:var(--fumaca)}
.notice{display:flex;gap:var(--s-8);align-items:flex-start;font-size:var(--t-14);color:var(--marfim-2);padding:var(--s-12) var(--s-16);background:var(--superficie);border:1px solid var(--linha);border-radius:var(--r-md);margin-top:var(--s-24)}
.notice svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--fumaca)}

/* Tags (voz da máquina) */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:var(--t-12);font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:var(--r-sm);border:1px solid var(--linha);color:var(--marfim-2);white-space:nowrap}
.tag.accent{color:var(--bronze);border-color:color-mix(in oklab, var(--bronze) 40%, transparent);background:var(--wash)}
.tag.ok{color:var(--patina);border-color:color-mix(in oklab, var(--patina) 40%, transparent);background:var(--ok-wash)}
.tag.warn{color:var(--cobre);border-color:color-mix(in oklab, var(--cobre) 40%, transparent);background:var(--warn-wash)}
.tag.danger{color:var(--perigo);border-color:color-mix(in oklab, var(--perigo) 45%, transparent);background:var(--danger-wash)}
.tag svg{width:12px;height:12px}

/* Dimensões */
.dims{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 var(--s-48)}
@container (max-width: 760px){.dims{grid-template-columns:1fr}}
.dim{padding:var(--s-16) 0;border-bottom:1px solid var(--linha)}
.dim-head{display:flex;justify-content:space-between;gap:var(--s-12);align-items:baseline}
.dim-name{font-weight:600}
.dim-lay{font-size:var(--t-14);color:var(--fumaca)}
.dim-score{font-family:var(--voz-maquina);font-size:var(--t-24);font-weight:500;color:var(--marfim)}
.bar{height:6px;border-radius:6px;background:var(--superficie-2);margin-top:var(--s-8);overflow:hidden}
.bar i{display:block;height:100%;width:var(--w);background:var(--bronze);border-radius:6px;transform-origin:left;transition:transform 700ms var(--ease)}
[data-reveal]:not(.in) .bar i{transform:scaleX(0)}
.bar.low i{background:var(--cobre)}
.dim-foot{display:flex;gap:var(--s-8);flex-wrap:wrap;margin-top:var(--s-8)}

/* Números */
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--linha);border-bottom:1px solid var(--linha)}
.nums>div{padding:var(--s-16) var(--s-16) var(--s-16) 0}
.nums>div+div{padding-left:var(--s-16);border-left:1px solid var(--linha)}
.nums .lbl{font-size:var(--t-14);color:var(--fumaca)}
.nums .val{font-family:var(--voz-maquina);font-size:var(--t-24);font-weight:500;line-height:1.25;margin:4px 0}
.nums p{font-size:var(--t-14);color:var(--marfim-2)}

/* Riscos */
.risk{display:grid;grid-template-columns:140px 1fr;gap:var(--s-16)}
.risk .lvl{display:flex;flex-direction:column;gap:var(--s-4);align-items:flex-start}
.risk .pi{font-family:var(--voz-maquina);font-size:var(--t-12);color:var(--fumaca)}
.risk b{display:block}
.risk p{font-size:var(--t-14);color:var(--marfim-2)}
.risk .mit{margin-top:var(--s-8);font-size:var(--t-14)}
.empty-block{padding:var(--s-24);border:1px dashed var(--linha-2);border-radius:var(--r-lg);background:var(--superficie);display:flex;gap:var(--s-16);align-items:flex-start}
.empty-block svg{width:24px;height:24px;color:var(--bronze);flex:none}
.empty-block p{color:var(--marfim-2);font-size:var(--t-14)}
.empty-block b{display:block;font-size:var(--t-16);margin-bottom:2px}

/* Listas e tabelas */
.toolbar{display:flex;gap:var(--s-12);flex-wrap:wrap;align-items:center;margin-bottom:var(--s-16)}
.search{position:relative;flex:1;min-width:220px;max-width:360px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--fumaca)}
.search input{padding-left:36px}
.seg{display:inline-flex;border:1px solid var(--linha-2);border-radius:var(--r-md);overflow:hidden}
.seg a{padding:0 var(--s-12);height:38px;display:inline-flex;align-items:center;font-size:var(--t-14);color:var(--marfim-2);text-decoration:none;border-left:1px solid var(--linha)}
.seg a:first-child{border-left:0}
.seg a[aria-current="true"]{background:var(--bronze);color:var(--bronze-tinta)}
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;font-family:var(--voz-maquina);font-size:var(--t-12);font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--fumaca);padding:var(--s-8) var(--s-12) var(--s-8) 0;border-bottom:1px solid var(--linha-2)}
.table td{padding:var(--s-12) var(--s-12) var(--s-12) 0;border-bottom:1px solid var(--linha);vertical-align:middle;font-size:var(--t-14)}
.table td.name a{font-weight:600;font-size:var(--t-16);color:var(--marfim);text-decoration:none}
.table td.name a:hover{text-decoration:underline}
.table td.name small{display:block;color:var(--fumaca)}
.table td .mono{font-size:var(--t-14)}
.table tr.archived td{color:var(--fumaca)}
.row-actions{display:flex;gap:var(--s-4);justify-content:flex-end}

/* Linha do tempo */
.timeline{list-style:none;margin:0;padding:0;border-top:1px solid var(--linha)}
.timeline li{display:grid;grid-template-columns:120px 1fr auto;gap:var(--s-16);align-items:center;padding:var(--s-16) 0;border-bottom:1px solid var(--linha)}
.timeline .when{font-size:var(--t-14);color:var(--fumaca)}
.timeline .when b{display:block;font-family:var(--voz-maquina);font-weight:500;color:var(--marfim)}
.timeline .what b{font-size:var(--t-18);font-weight:600}
.timeline .what .meta{display:flex;gap:var(--s-8);flex-wrap:wrap;margin-top:var(--s-8)}
.timeline .acts{display:flex;gap:var(--s-8);flex-wrap:wrap;justify-content:flex-end}
.progress{height:4px;border-radius:4px;background:var(--superficie-2);overflow:hidden;width:160px;margin-top:var(--s-8)}
.progress i{display:block;height:100%;background:var(--bronze);width:var(--w)}

/* Formulários */
.field{display:flex;flex-direction:column;gap:var(--s-4);margin-bottom:var(--s-16)}
.field label,.field .lbl{font-size:var(--t-14);font-weight:500}
.field .hint{font-size:var(--t-12);color:var(--fumaca)}
.input,select.input{height:var(--control);padding:0 var(--s-12);border:1px solid var(--linha-2);border-radius:var(--r-md);background:var(--tinta-2);width:100%;transition:border-color var(--fast) var(--ease)}
.input:hover{border-color:var(--fumaca)}
.input:focus{border-color:var(--bronze)}
.input[aria-invalid="true"]{border-color:var(--perigo);background:var(--danger-wash)}
.input.is-valid{border-color:var(--patina)}
.err{font-size:var(--t-12);color:var(--perigo);display:flex;gap:4px;align-items:center}
.err svg{width:14px;height:14px}
.err[hidden]{display:flex;visibility:hidden;min-height:1.25em}
.err{min-height:1.25em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 var(--s-16)}
.choice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--s-8)}
.choice{display:flex;gap:var(--s-12);align-items:flex-start;padding:var(--s-12) var(--s-16);border:1px solid var(--linha-2);border-radius:var(--r-md);cursor:pointer;transition:border-color var(--fast) var(--ease),background-color var(--fast) var(--ease)}
.choice:hover{border-color:var(--marfim-2)}
.choice input{margin-top:4px;accent-color:var(--bronze);width:16px;height:16px;flex:none}
.choice:has(input:checked){border-color:var(--bronze);background:var(--wash)}
.choice b{display:block;font-weight:600;font-size:var(--t-14)}
.choice span{font-size:var(--t-14);color:var(--marfim-2)}

/* Assistente */
.wizard{max-width:760px;margin:var(--s-32) auto 0}
.wizard h1{font-size:clamp(2.25rem, 1.6rem + 2.6vw, 3.5rem);line-height:1.04;letter-spacing:-.035em}
.wizard .lead{font-size:var(--t-18);color:var(--marfim-2);margin:var(--s-16) 0 var(--s-16);max-width:54ch}
.wizard-steps{display:flex;gap:var(--s-24);font-family:var(--voz-maquina);font-size:var(--t-12);letter-spacing:.1em;text-transform:uppercase;color:var(--fumaca);margin:var(--s-8) 0 var(--s-32)}
.wizard-steps [aria-current="step"]{color:var(--bronze)}
/* D-03 palavra viva */
.live{display:inline-block;clip-path:inset(0 0 0 0);animation:digita 900ms steps(var(--n)) 300ms both;padding-right:.08em}
@keyframes digita{from{clip-path:inset(0 100% 0 0)}}
.mode-cards{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-16)}
.mode-card{padding:var(--s-24);border:1px solid var(--linha-2);border-radius:var(--r-lg);background:var(--superficie);cursor:pointer;text-align:left;color:var(--marfim);transition:border-color var(--fast) var(--ease),transform var(--dur) var(--ease)}
.mode-card:hover{border-color:var(--bronze);transform:translateY(-2px)}
.mode-card h2{font-size:var(--t-24);margin:var(--s-16) 0 var(--s-8)}
.mode-card p{font-size:var(--t-14);color:var(--marfim-2)}
.mode-card svg{width:28px;height:28px;color:var(--bronze)}
.form-foot{display:flex;justify-content:space-between;gap:var(--s-12);margin-top:var(--s-24);padding-top:var(--s-16);border-top:1px solid var(--linha)}

/* Questionário */
.quiz{display:grid;grid-template-columns:240px minmax(0,1fr);gap:var(--s-48)}
.rail{position:sticky;top:104px;align-self:start}
.rail ol{list-style:none;margin:0;padding:0}
.rail li a{display:flex;align-items:center;gap:var(--s-12);padding:var(--s-8) var(--s-12);border-radius:var(--r-md);text-decoration:none;color:var(--marfim-2);font-size:var(--t-14);border:1px solid transparent}
.rail li a:hover{background:var(--superficie)}
.rail li a[aria-current="step"]{background:var(--superficie);border-color:var(--linha);color:var(--marfim);font-weight:600}
.dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--linha-2);display:grid;place-items:center;flex:none;font-family:var(--voz-maquina);font-size:var(--t-12)}
.dot.done{background:var(--bronze);border-color:var(--bronze);color:var(--bronze-tinta)}
.dot svg{width:12px;height:12px}
.saved{font-family:var(--voz-maquina);font-size:var(--t-12);letter-spacing:.04em;color:var(--fumaca);margin-top:var(--s-16);display:flex;gap:6px;align-items:center}
.saved svg{width:14px;height:14px;color:var(--patina)}
.block-head h1{font-size:clamp(2rem, 1.6rem + 1.6vw, 2.75rem);letter-spacing:-.03em}
.block-head p{color:var(--marfim-2);margin-top:var(--s-8);max-width:60ch}
.item{padding:var(--s-24) 0;border-bottom:1px solid var(--linha)}
.item-q{display:flex;gap:var(--s-8);align-items:flex-start;justify-content:space-between}
.item-q h2{font-size:var(--t-18);font-weight:600;line-height:1.4;letter-spacing:-.01em}
.help-btn{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--linha-2);background:transparent;cursor:pointer;display:grid;place-items:center;font-family:var(--voz-humana);font-style:italic;font-size:var(--t-16);color:var(--bronze)}
.help-btn:hover{border-color:var(--bronze)}
.help-text{margin-top:var(--s-8);font-size:var(--t-14);color:var(--marfim-2);background:var(--superficie);border:1px solid var(--linha);padding:var(--s-12) var(--s-16);border-radius:var(--r-md)}
.opts{display:grid;gap:var(--s-8);margin-top:var(--s-16)}
.opt{display:flex;gap:var(--s-12);align-items:center;padding:var(--s-12) var(--s-16);border:1px solid var(--linha-2);border-radius:var(--r-md);cursor:pointer;transition:border-color var(--fast) var(--ease),background-color var(--fast) var(--ease)}
.opt:hover{border-color:var(--marfim-2)}
.opt input{accent-color:var(--bronze);width:16px;height:16px;flex:none}
.opt:has(input:checked){border-color:var(--bronze);background:var(--wash)}
.opt.unknown{border-style:dashed}
.calc{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--s-32);align-items:start}
.calc-out{position:sticky;top:104px;padding:var(--s-24);background:var(--superficie);border:1px solid var(--linha-2);border-radius:var(--r-lg)}
.calc-out h3{margin-bottom:var(--s-8)}
.calc-out dl{margin:0}
.calc-out dt{font-size:var(--t-14);color:var(--fumaca);margin-top:var(--s-16)}
.calc-out dd{margin:0;font-family:var(--voz-maquina);font-size:var(--t-24);font-weight:500;line-height:1.3}
.calc-out dd small{display:block;font-family:var(--voz-estrutura);font-size:var(--t-12);color:var(--marfim-2);margin-top:2px}
.mode-row{display:flex;gap:var(--s-8);flex-wrap:wrap;margin:var(--s-12) 0}
.mode-row label{display:inline-flex;gap:6px;align-items:center;padding:6px var(--s-12);border:1px solid var(--linha-2);border-radius:var(--r-md);font-size:var(--t-14);cursor:pointer}
.mode-row label:has(input:checked){border-color:var(--bronze);background:var(--wash)}
.mode-row input{accent-color:var(--bronze)}
.spend{display:grid;grid-template-columns:1fr 180px;gap:var(--s-8) var(--s-16);align-items:center}
.spend label{font-size:var(--t-14)}
.spend .total{font-weight:600;padding-top:var(--s-8);border-top:1px solid var(--linha)}
.spend .total.mono{font-family:var(--voz-maquina)}
.quiz-foot{display:flex;justify-content:space-between;align-items:center;gap:var(--s-12);margin-top:var(--s-32)}
.alert{display:flex;gap:var(--s-12);align-items:flex-start;padding:var(--s-16);border-radius:var(--r-lg);background:var(--danger-wash);border:1px solid color-mix(in oklab, var(--perigo) 40%, transparent);margin-top:var(--s-24)}
.alert svg{width:20px;height:20px;color:var(--perigo);flex:none;margin-top:2px}
.alert b{display:block}
.alert ul{margin:var(--s-8) 0 0;padding-left:var(--s-16);font-size:var(--t-14)}
.success{display:flex;gap:var(--s-12);align-items:flex-start;padding:var(--s-16);border-radius:var(--r-lg);background:var(--ok-wash);border:1px solid color-mix(in oklab, var(--patina) 40%, transparent);margin-top:var(--s-16)}
.success svg{width:20px;height:20px;color:var(--patina);flex:none;margin-top:2px}

/* Carregando */
.skeleton{background:linear-gradient(90deg,var(--superficie) 0%,var(--superficie-2) 50%,var(--superficie) 100%);background-size:200% 100%;animation:shimmer 1.4s linear infinite;border-radius:var(--r-md)}
@keyframes shimmer{to{background-position:-200% 0}}

/* Entrada das seções (uma vez por tela) */
.rise{animation:sobe var(--dur) var(--ease) both;animation-delay:calc(var(--i, 0) * 60ms)}
@keyframes sobe{from{opacity:0;transform:translateY(8px)}}

/* Comparar */
.cmp-row{display:grid;grid-template-columns:minmax(0,1.4fr) 90px 90px 130px;gap:var(--s-12);align-items:center;padding:var(--s-12) 0;border-bottom:1px solid var(--linha);font-size:var(--t-14)}
.cmp-row.head{font-family:var(--voz-maquina);font-size:var(--t-12);letter-spacing:.1em;text-transform:uppercase;color:var(--fumaca);border-bottom:1px solid var(--linha-2)}
.cmp-row .v{font-family:var(--voz-maquina);font-size:var(--t-18)}
.delta{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.delta svg{width:14px;height:14px}
.delta.up{color:var(--patina)}.delta.down{color:var(--perigo)}.delta.same{color:var(--fumaca)}

/* Configurações */
.settings section{display:grid;grid-template-columns:260px minmax(0,1fr);gap:var(--s-32);padding:var(--s-32) 0;border-bottom:1px solid var(--linha)}
.settings section>div:first-child p{font-size:var(--t-14);color:var(--fumaca);margin-top:var(--s-4)}
.read-list{margin:var(--s-8) 0 0;padding-left:var(--s-16);font-size:var(--t-14);color:var(--marfim-2)}

/* Modal (sem sombra: o véu separa) */
.backdrop{position:fixed;inset:0;background:var(--veu);display:grid;place-items:center;padding:var(--s-16);z-index:60;animation:fade var(--dur) var(--ease)}
.modal{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--solido);border:1px solid var(--linha-2);border-radius:var(--r-lg);padding:var(--s-24);animation:sobe var(--dur) var(--ease)}
.modal.wide{width:min(820px,100%)}
.modal h2{margin-bottom:var(--s-8)}
.modal .consequence{color:var(--marfim-2);font-size:var(--t-14)}
.modal-foot{display:flex;justify-content:flex-end;gap:var(--s-12);margin-top:var(--s-24);flex-wrap:wrap}
@keyframes fade{from{opacity:0}}
.report{border:1px solid var(--linha-2);border-radius:var(--r-md);padding:var(--s-24);background:var(--superficie-2);font-size:var(--t-14)}
.report h3{font-size:var(--t-24)}
.report .r-row{display:flex;justify-content:space-between;border-bottom:1px solid var(--linha);padding:6px 0}
.report .r-row b{font-family:var(--voz-maquina);font-weight:500}

.toasts{position:fixed;bottom:var(--s-24);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:var(--s-8);z-index:80;width:min(520px,calc(100% - 32px))}
.toast{display:flex;gap:var(--s-12);align-items:center;background:var(--solido);color:var(--marfim);border:1px solid var(--linha-2);padding:var(--s-12) var(--s-16);border-radius:var(--r-md);font-size:var(--t-14);animation:sobe var(--dur) var(--ease)}
.toast svg{width:18px;height:18px;flex:none;color:var(--patina)}

.tour-hole{position:fixed;z-index:70;border-radius:var(--r-lg);outline:9999px solid var(--veu);border:2px solid var(--bronze);transition:top var(--dur) var(--ease),left var(--dur) var(--ease),width var(--dur) var(--ease),height var(--dur) var(--ease);pointer-events:none}
.tour-card{position:fixed;z-index:71;width:min(360px,calc(100% - 32px));background:var(--solido);border:1px solid var(--linha-2);border-radius:var(--r-lg);padding:var(--s-24)}
.tour-card .count{font-family:var(--voz-maquina);font-size:var(--t-12);letter-spacing:.1em;text-transform:uppercase;color:var(--bronze)}
.tour-card h2{font-size:var(--t-24);margin:var(--s-8) 0}
.tour-card p{font-size:var(--t-14);color:var(--marfim-2)}
.tour-card .row{display:flex;justify-content:space-between;align-items:center;margin-top:var(--s-16);gap:var(--s-8)}

@media (max-width:860px){
  .plate-wrap,.cols,.cols.three,.quiz,.calc,.settings section{grid-template-columns:1fr;gap:var(--s-24)}
  .rail{position:static}
  .rail ol{display:flex;overflow-x:auto;gap:var(--s-4);padding-bottom:var(--s-8)}

  .timeline .acts{justify-content:flex-start}
  .cmp-row{grid-template-columns:minmax(0,1fr) 56px 56px 96px}
  .risk{grid-template-columns:1fr}
  .nav{justify-content:flex-start}
}
@media (max-width:640px){
  .top{padding:var(--s-8) var(--s-12) 0}
  .top-in{height:auto;flex-wrap:wrap;padding:var(--s-8) var(--s-12);gap:var(--s-8)}
  .nav{order:3;flex-basis:100%;overflow-x:auto}
  .mode-chip,.brand-txt span{display:none}
  main{padding:var(--s-32) var(--s-16) var(--s-64)}
  .steps{height:170px;gap:var(--s-8)}

  .step-labels div{font-size:var(--t-12)}

  .spend{grid-template-columns:1fr}
  .table thead{display:none}
  .table tr{display:grid;grid-template-columns:1fr auto;padding:var(--s-12) 0;border-bottom:1px solid var(--linha)}
  .table td{border:0;padding:2px 0}
  .table td.hide-sm{display:none}
  .btn{min-height:44px}
  .pauta{margin:var(--s-32) 0}
  .here-long{display:none}
  .brand{min-height:44px}
  .icon-btn{width:44px;height:44px}
  a.solo{display:inline-flex;align-items:center;min-height:44px}
  .crumb a{display:inline-flex;align-items:center;min-height:44px}
  .input,select.input{height:44px}
  .choice input,.opt input{width:20px;height:20px}
  [data-action="theme-toggle"]{margin-left:auto}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  [data-reveal]:not(.in) .bar i{transform:none}
}

.plate-cap>span{display:flex;align-items:center;gap:10px;font-family:var(--voz-maquina);font-size:var(--t-12);font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--fumaca)}
.plate-cap>span:first-child{color:var(--bronze)}

<div class="proto-band" role="note">Protótipo de demonstração: dados fictícios e em memória. Atualizar a página volta ao início.</div>

(function(){
'use strict';

/* ---------- Icons ---------- */
const I = {

/* ---------- Engine (demonstração) ---------- */
function calcOut(c){
  if (!c) return {known:false};
  let spend = null, spendOrigin = 'desconhecido', news = null, newOrigin = 'desconhecido';
  if (c.spendMode === 'exact'){ spend = SPEND_PARTS.reduce((s,[k]) => s + (c.spend[k] || 0), 0); spendOrigin = 'medido'; }
  else if (c.spendMode === 'range' && c.spendRange != null){ spend = SPEND_RANGES[c.spendRange][1]; spendOrigin = 'estimado'; }
  if (c.newMode === 'exact' && c.newCustomers > 0){ news = c.newCustomers; newOrigin = 'medido'; }
  else if (c.newMode === 'range' && c.newRange != null){ news = NEW_RANGES[c.newRange][1]; newOrigin = 'estimado'; }
  const out = {spend, news, spendOrigin, newOrigin};
  out.known = spend != null && news != null && news > 0;
  out.origin = !out.known ? 'desconhecido' : (spendOrigin === 'medido' && newOrigin === 'medido' ? 'medido' : 'estimado');
  if (out.known) out.cac = Math.round(spend / news);
  const ticket = c.ticket, freq = c.freq != null ? FREQ[c.freq][1] : null, life = c.life != null ? LIFE[c.life][1] : null, margin = c.margin;
  if (ticket && freq && life && margin != null){
    out.ltv = Math.round(ticket * freq * life * (margin / 100));
    out.monthlyProfit = ticket * freq / 12 * (margin / 100);
  }
  if (out.known && out.ltv != null){
    out.ratio = out.cac > 0 ? out.ltv / out.cac : null;
    out.payback = out.monthlyProfit > 0 ? out.cac / out.monthlyProfit : null;
  }
  return out;
}
function ratioSignal(r){
  if (r == null) return {cls:'', label:'Sem dados', txt:'Falta o custo de um cliente para calcular.'};
  if (r < 1) return {cls:'danger', label:'Crítico', txt:'Cada cliente deixa menos do que custou: crescer aumenta o prejuízo.'};
  if (r < 3) return {cls:'warn', label:'Atenção', txt:'Cada cliente deixa menos de 3 vezes o que custou.'};
  if (r <= 5) return {cls:'ok', label:'Saudável', txt:'Cada cliente deixa entre 3 e 5 vezes o que custou.'};
  return {cls:'accent', label:'Pode investir mais', txt:'Retorno alto: talvez você esteja investindo pouco para atrair clientes.'};
}
function dimScore(answers, dim){
  const ids = Object.keys(ITEMS).filter(id => ITEMS[id].dim === dim);
  let sum = 0, unknown = 0;
  ids.forEach(id => { const v = answers[id]; if (v === null) unknown++; else sum += (v || 0); });
  return {score: Math.round(sum / (ids.length * 3) * 100), unknown, total: ids.length};
}
function evaluate(d){
  const a = d.answers || {};
  const calc = calcOut(d.calc);
  const dims = {};
  Object.keys(DIMS).forEach(k => { dims[k] = dimScore(a, k); });
  // Canal e receita combina a resposta com a razão calculada
  let ratioLevel = null;
  if (calc.ratio != null) ratioLevel = calc.ratio < 1 ? 0 : calc.ratio < 3 ? 1 : calc.ratio <= 5 ? 3 : 2;
  const cmItem = a.cm1;
  if (ratioLevel != null && cmItem != null) dims.cm.score = Math.round((ratioLevel + cmItem) / 6 * 100);
  else if (ratioLevel != null) dims.cm.score = Math.round(ratioLevel / 3 * 100);
  if (!calc.known) dims.cm.unknown += 1;
  const s = (k) => dims[k].score;
  const checks = [
    [2, [['cac', calc.known], ['mp', s('mp') >= 50]]],
    [3, [['ratio', calc.ratio != null && calc.ratio >= 3], ['payback', calc.payback != null && calc.payback <= 12], ['pc', s('pc') >= 60], ['re', s('re') >= 50]]],
    [4, [['mm', s('mm') >= 60], ['co', s('co') >= 70], ['es', a.es1 === 3]]]
  ];
  let stage = 1, lock = null;
  for (const [target, conds] of checks){
    const fail = conds.find(([, ok]) => !ok);
    if (fail){ lock = fail[0]; break; }
    stage = target;
  }
  // Riscos por sinais (matriz 5x5)
  const risks = [];
  const add = (id, title, cause, p, i, mit) => risks.push({id, title, cause, p, i, score:p*i, mit});
  if (!calc.known) add('cac','Investir em divulgação sem saber quanto custa um cliente','O gasto ou o número de clientes novos não é conhecido.',4,4,ACTIONS.cac.h);
  if (calc.ratio != null && calc.ratio < 1) add('ratio1','Cada venda nova aumenta o prejuízo','Cada cliente deixa menos do que custou para ser conquistado.',4,5,ACTIONS.ratio.h);
  else if (calc.ratio != null && calc.ratio < 3) add('ratio3','Margem apertada para crescer com anúncio','Cada cliente deixa menos de 3 vezes o que custou.',3,3,ACTIONS.ratio.h);
  if (a.pc1 === 3) add('dep','Depender de um só canal','Mais de 70% dos clientes novos vêm do mesmo lugar. Se ele mudar as regras, as vendas caem.',3,4,ACTIONS.dep.h);
  if (s('re') < 40) add('re','Vender só para gente nova','Quase nada é feito para o cliente comprar de novo.',3,4,ACTIONS.re.h);
  if (calc.payback != null && calc.payback > 12) add('pb','Caixa preso em clientes novos','O custo de um cliente leva mais de 12 meses para voltar.',3,3,ACTIONS.payback.h);
  if (a.mm1 === 0) add('mm','Meta maior do que o mercado','A meta pede mais de 30% dos clientes possíveis.',2,4,ACTIONS.mm.h);
  risks.sort((x,y) => y.score - x.score);
  // Ações: trava primeiro, depois as dimensões mais fracas
  const acts = [];
  const pushAct = (k) => { if (k && ACTIONS[k] && !acts.includes(k)) acts.push(k); };
  if (stage < 4) pushAct(lock);
  if (a.pc1 === 3) pushAct('dep');
  Object.keys(DIMS).filter(k => k !== 'cm').sort((x,y) => s(x) - s(y)).forEach(pushAct);
  // Confiança
  let unknown = Object.keys(ITEMS).filter(id => a[id] === null).length;
  if (calc.spendOrigin === 'desconhecido') unknown++;
  if (calc.newOrigin === 'desconhecido') unknown++;
  const total = Object.keys(ITEMS).length + 2;
  let conf = unknown / total <= 0.1 ? 'alta' : unknown / total <= 0.25 ? 'média' : 'baixa';
  if (conf === 'alta' && calc.origin === 'estimado') conf = 'média';
  const weakest = Object.keys(DIMS).sort((x,y) => s(x) - s(y))[0];
  const avg = Math.round(Object.keys(DIMS).reduce((t,k) => t + s(k), 0) / 8);
  return {dims, calc, stage, lock: stage < 4 ? lock : null, risks: risks.slice(0,5), actions: acts.slice(0,3), conf, unknown, weakest, avg};
}

/* ---------- Signature: escada com trava ---------- */
function escada(opts){
  const {stage, prev, lock, caption, primary, tour, counts, linkStages} = opts;
  const heights = [28, 48, 68, 88];
  const label = counts ? 'Carteira por estágio' : ('Estágio ' + stage + ' de 4: ' + STAGES[stage-1].name + (prev ? '. Diagnóstico anterior no estágio ' + prev + '.' : '.')) + (lock ? ' Trava para subir: ' + LOCKS[lock] + '.' : '');
  let steps = '';
  for (let i = 1; i <= 4; i++){
    const cls = counts ? (counts[i] ? 'is-current' : '') : (i === stage ? 'is-current' : (prev && i === prev && prev !== stage ? 'is-trail' : (i < stage ? 'is-below' : '')));
    let over = '';
    if (counts) over = '<span class="here">' + (counts[i] || 0) + (counts[i] === 1 ? ' empresa' : ' empresas') + '</span>';
    else if (i === stage) over = '<span class="here">' + I.pin + '<span class="here-long">Você está </span>aqui</span>';
    else if (prev && i === prev && prev !== stage) over = '<span class="trail-tag">antes</span>';
    else if (lock && i === stage + 1) over = '<span class="lock" title="Trava">' + I.lock + '</span>';
    const inner = '<div class="riser" style="--h:' + heights[i-1] + '%">' + over + '</div>';
    steps += linkStages ? '<a class="step ' + cls + '" href="#/empresas?estagio=' + i + '" aria-label="Ver empresas no estágio ' + i + '" style="text-decoration:none">' + inner + '</a>' : '<div class="step ' + cls + '">' + inner + '</div>';
  }
  const labels = STAGES.map(st => '<div class="' + (!counts && st.n === stage ? 'cur' : '') + '"><b>' + st.n + '. ' + st.name + '</b></div>').join('');
  return '<figure class="plate"' + (primary ? ' data-aioson-primary' : '') + (tour ? ' data-aioson-tour="' + tour + '"' : '') + ' data-aioson-id="escada">' +
    '<div class="steps" role="img" aria-label="' + esc(label) + '">' + steps + '</div><div class="pauta-mini" aria-hidden="true"></div>' +
    '<div class="step-labels">' + labels + '</div>' +
    '<figcaption class="plate-cap">' + caption + '</figcaption></figure>';
}

function sparkline(points){
  if (points.length < 2) return '';
  const w = 320, h = 56, pad = 6;
  const xs = points.map((_, i) => pad + i * (w - pad*2) / (points.length - 1));
  const ys = points.map(p => h - pad - (p.avg / 100) * (h - pad*2));
  const path = xs.map((x,i) => (i ? 'L' : 'M') + x.toFixed(1) + ' ' + ys[i].toFixed(1)).join(' ');
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" role="img" aria-label="Evolução: ' + points.map(p => dateShort(p.d.createdAt) + ' ' + p.avg + ' pontos').join(', ') + '">' +
    '<line x1="0" x2="' + w + '" y1="' + (h-pad) + '" y2="' + (h-pad) + '"/>' +
    '<path d="' + path + '" fill="none" stroke-width="2"/>' + xs.map((x,i) => '<circle cx="' + x.toFixed(1) + '" cy="' + ys[i].toFixed(1) + '" r="3.5" stroke-width="2"/>').join('') + '</svg>';
}

/* ---------- Empresas ---------- */
function emptyCompanies(){
  return '<div class="page-head"><div><h1>Empresas</h1></div></div><div class="empty-block" data-state="empty" data-aioson-id="companies-empty">' + I.people + '<div><b>Nenhuma empresa cadastrada</b><p>Cadastre a primeira empresa para começar um diagnóstico. Cada empresa guarda o seu histórico.</p><p style="margin-top:12px"><button class="btn primary" data-action="company-new">' + I.plus + 'Cadastrar a primeira empresa</button></p></div></div>';
}
function viewCompanies(q){
  if (q.state === 'empty') return emptyCompanies();
  const showArch = q.arquivadas === '1';
  const term = (q.busca || '').toLowerCase();
  let list = S.companies.map(companyFacts).filter(f => showArch ? f.c.archived : !f.c.archived);
  if (q.estagio) list = list.filter(f => String(f.stage) === q.estagio);
  if (q.filtro === 'parados') list = list.filter(f => f.draftIdle != null && f.draftIdle > 7);
  if (q.filtro === 'antigos') list = list.filter(f => f.days == null || f.days > 90);
  if (q.filtro === 'risco') list = list.filter(f => f.highRisk);
  if (term) list = list.filter(f => f.c.name.toLowerCase().includes(term));
  const filters = [['', 'Todos'], ['1','Estágio 1'], ['2','Estágio 2'], ['3','Estágio 3'], ['4','Estágio 4']];
  const filterLabel = q.filtro === 'parados' ? 'Rascunhos parados' : q.filtro === 'antigos' ? 'Sem diagnóstico há mais de 90 dias' : q.filtro === 'risco' ? 'Com risco alto' : null;
  const rows = list.map(f => '<tr class="' + (f.c.archived ? 'archived' : '') + '" data-row-id="' + f.c.id + '">' +
    '<td class="name"><a href="#/empresa/' + f.c.id + '">' + esc(f.c.name) + '</a><small>' + esc(f.c.segment) + '</small></td>' +
    '<td>' + (f.stage ? '<span class="tag accent">Estágio ' + f.stage + ' · ' + STAGES[f.stage-1].name + '</span>' : '<span class="tag">Sem diagnóstico</span>') + '</td>' +
    '<td class="hide-sm">' + (f.last ? '<span class="mono">' + dateBR(f.last.createdAt) + '</span><div class="note">há ' + f.days + ' dias</div>' : '-') + '</td>' +
    '<td class="hide-sm">' + (f.draft ? '<span class="tag warn">' + I.clock + 'Rascunho ' + doneBlocks(f.draft) + '/8</span>' : '') + (f.highRisk ? ' <span class="tag danger">' + I.alert + 'Risco alto</span>' : '') + '</td>' +
    '<td><div class="row-actions">' + (f.c.archived
        ? '<button class="btn ghost" data-action="company-restore" data-id="' + f.c.id + '" aria-label="Restaurar ' + esc(f.c.name) + '">' + I.restore + '<span class="hide-sm">Restaurar</span></button><button class="btn ghost" data-action="company-delete" data-id="' + f.c.id + '" aria-label="Excluir ' + esc(f.c.name) + '">' + I.trash + '</button>'
        : '<button class="btn ghost" data-action="company-edit" data-id="' + f.c.id + '" aria-label="Editar ' + esc(f.c.name) + '">' + I.edit + '</button><button class="btn ghost" data-action="company-archive" data-id="' + f.c.id + '" aria-label="Arquivar ' + esc(f.c.name) + '">' + I.archive + '</button>') +
    '</div></td></tr>').join('');
  return '' +
  '<div class="page-head"><div><h1>Empresas</h1><p class="sub">' + (filterLabel ? 'Filtro: ' + filterLabel + ' · <a href="#/empresas">limpar</a>' : (showArch ? 'Empresas arquivadas' : 'Empresas ativas')) + '</p></div><button class="btn primary" data-action="company-new" data-aioson-id="companies-new">' + I.plus + 'Nova empresa</button></div>' +
  '<div class="toolbar"><div class="search">' + I.search + '<label class="sr-only" for="busca">Buscar empresa</label><input id="busca" class="input" type="search" autocomplete="off" placeholder="Buscar pelo nome" value="' + esc(q.busca || '') + '" data-action="search"></div>' +
  '<nav class="seg" aria-label="Filtrar por estágio">' + filters.map(([v,l]) => '<a href="#/empresas' + (v ? '?estagio=' + v : '') + (showArch ? (v ? '&' : '?') + 'arquivadas=1' : '') + '" aria-current="' + ((q.estagio || '') === v && !q.filtro ? 'true' : 'false') + '">' + l + '</a>').join('') + '</nav>' +
  '<a class="btn ghost" href="#/empresas' + (showArch ? '' : '?arquivadas=1') + '">' + I.archive + (showArch ? 'Ver ativas' : 'Ver arquivadas') + '</a></div>' +
  (list.length ? '<table class="table" data-aioson-id="companies-table"><thead><tr><th>Empresa</th><th>Estágio atual</th><th class="hide-sm">Último diagnóstico</th><th class="hide-sm">Atenção</th><th><span class="sr-only">Ações</span></th></tr></thead><tbody>' + rows + '</tbody></table>'
    : '<div class="empty-block" data-state="empty">' + I.search + '<div><b>Nenhuma empresa encontrada</b><p>' + (term ? 'Nenhum nome contém "' + esc(q.busca) + '".' : showArch ? 'Nenhuma empresa arquivada.' : 'Nenhuma empresa com esse filtro.') + '</p><p style="margin-top:12px"><a class="btn" href="#/empresas">Limpar filtros</a></p></div></div>');
}

/* ---------- Empresa ---------- */
function viewCompany(id, q){
  const c = company(id);
  if (!c) return viewNotFound();
  const list = q.state === 'empty' ? [] : diagsOf(c.id);
  const model = (SALES_MODELS.find(m => m[0] === c.model) || ['', ''])[1];
  const active = list.filter(d => d.status !== 'archived');
  const archived = list.filter(d => d.status === 'archived');
  const last = lastDone(c.id), draft = draftOf(c.id);
  const item = (d) => {
    if (d.status === 'draft'){
      const n = doneBlocks(d);
      return '<li data-row-id="' + d.id + '"><div class="when"><b>' + dateBR(d.createdAt) + '</b>Rascunho</div><div class="what"><b>Em andamento</b><div class="meta"><span class="tag warn">' + I.clock + n + ' de 8 blocos</span><span class="note">Salvo em ' + dateBR(d.updatedAt) + '</span></div><div class="progress"><i style="--w:' + Math.round(n/8*100) + '%"></i></div></div><div class="acts"><a class="btn primary" href="#/diagnostico/' + d.id + '">Continuar</a><button class="btn ghost" data-action="diag-discard" data-id="' + d.id + '" title="Apaga as respostas deste rascunho">' + I.trash + 'Descartar rascunho</button></div></li>';
    }
    const ev = evaluate(d);
    return '<li data-row-id="' + d.id + '"><div class="when"><b>' + dateBR(d.createdAt) + '</b>' + (d.status === 'archived' ? 'Arquivado' : 'Concluído') + '</div><div class="what"><b>Estágio ' + ev.stage + ' · ' + STAGES[ev.stage-1].name + '</b><div class="meta"><span class="tag" title="Versão do cálculo usada neste diagnóstico">Cálculo ' + d.rules + '</span><span class="tag" title="Quanto das respostas foi medido">Dados: confiança ' + ev.conf + '</span>' + (ev.risks.some(r => r.score >= 16) ? '<span class="tag danger">' + I.alert + 'Risco alto</span>' : '') + '</div></div><div class="acts">' +
      (d.status === 'archived' ? '<button class="btn" data-action="diag-restore" data-id="' + d.id + '">' + I.restore + 'Restaurar</button>' : '<a class="btn" href="#/resultado/' + d.id + '">Ver resultado</a>' + (prevDone(d) ? '<a class="btn ghost" href="#/comparar/' + d.id + '">' + I.compare + 'Comparar</a>' : '') + '<button class="btn ghost" data-action="diag-archive" data-id="' + d.id + '" aria-label="Arquivar diagnóstico de ' + dateBR(d.createdAt) + '" title="Tira da linha do tempo sem apagar">' + I.archive + 'Arquivar</button>') +
      '</div></li>';
  };
  return '' +
  (S.mode === 'consultoria' ? '<div class="crumb"><a href="#/empresas">Empresas</a></div>' : '') +
  '<div class="page-head"><div><h1>' + esc(c.name) + '</h1><p class="sub">' + esc(c.segment) + ' · ' + esc(model) + ' · ' + esc(REVENUE[c.revenue] || '') + (c.cnpj ? ' · CNPJ ' + esc(c.cnpj) : '') + (c.archived ? ' · <span class="tag">Arquivada</span>' : '') + '</p></div>' +
  '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-action="company-edit" data-id="' + c.id + '" data-aioson-id="company-edit">' + I.edit + 'Editar dados</button>' +
  (c.archived ? '' : (draft ? '<a class="btn primary" href="#/diagnostico/' + draft.id + '">Continuar diagnóstico</a>' : '<button class="btn primary" data-action="diag-new" data-company="' + c.id + '" data-aioson-id="company-new-diag">' + I.plus + 'Novo diagnóstico</button>')) + '</div></div>' +
  (last && !draft ? '<p class="note" style="margin-bottom:16px">O novo diagnóstico começa com as respostas de ' + dateBR(last.createdAt) + ' já preenchidas. Você só muda o que mudou.</p>' : '') +
  '<h2 style="margin:24px 0 12px">Diagnósticos</h2>' +
  (active.length ? '<ul class="timeline" data-aioson-id="company-timeline">' + active.map(item).join('') + '</ul>'
    : '<div class="empty-block" data-state="empty" data-aioson-id="company-empty">' + I.file + '<div><b>Nenhum diagnóstico ainda</b><p>O primeiro diagnóstico leva cerca de 12 minutos. Ele fica salvo enquanto você responde.</p><p style="margin-top:12px"><button class="btn primary" data-action="diag-new" data-company="' + c.id + '">Começar o primeiro diagnóstico</button></p></div></div>') +
  (archived.length ? '<details style="margin-top:24px"><summary class="note" style="cursor:pointer">Diagnósticos arquivados (' + archived.length + ')</summary><ul class="timeline" style="margin-top:12px">' + archived.map(item).join('') + '</ul></details>' : '') +
  (S.mode === 'consultoria' && !c.archived ? '<p style="margin-top:32px"><button class="link-btn" data-action="company-archive" data-id="' + c.id + '">Arquivar esta empresa</button></p>' : '') +
  (c.archived ? '<p style="margin-top:32px;display:flex;gap:16px"><button class="link-btn" data-action="company-restore" data-id="' + c.id + '">Restaurar empresa</button><button class="link-btn" style="color:var(--danger)" data-action="company-delete" data-id="' + c.id + '">Excluir empresa e diagnósticos</button></p>' : '');
}

/* ---------- Questionário ---------- */
let showErrors = {};
function viewQuiz(id, q){
  const d = diag(id);
  if (!d) return viewNotFound();
  if (d.status !== 'draft') { setTimeout(() => go('#/resultado/' + d.id), 0); return ''; }
  const c = company(d.companyId);
  const bi = Math.min(Math.max(parseInt(q.bloco || d.block || 0, 10) || 0, 0), BLOCKS.length - 1);
  d.block = bi;
  const b = BLOCKS[bi];
  const rail = BLOCKS.map((x, i) => '<li><a href="#/diagnostico/' + d.id + '?bloco=' + i + '"' + (i === bi ? ' aria-current="step"' : '') + '><span class="dot ' + (blockDone(d, x) ? 'done' : '') + '">' + (i + 1) + '</span>' + x.title + (blockDone(d, x) ? '<span class="sr-only"> (respondido)</span>' : '') + '</a></li>').join('');
  const body = b.calc ? viewCalc(d) : b.items.map(itemId => viewItem(d, itemId)).join('');
  const last = bi === BLOCKS.length - 1;
  const missing = BLOCKS.filter(x => !blockDone(d, x));
  return '' +
  '<div class="crumb"><a href="#/empresa/' + c.id + '">' + esc(c.name) + '</a></div>' +
  '<div class="quiz">' +
    '<aside class="rail" aria-label="Blocos do diagnóstico"><ol>' + rail + '</ol><p class="saved" id="saved" aria-live="polite">' + I.check + 'Salvo automaticamente às ' + (d.savedAt || nowTime()) + '</p>' +
      '<p style="margin-top:12px"><a class="note" href="#/empresa/' + c.id + '">Sair e continuar depois</a></p></aside>' +
    '<section data-aioson-id="quiz-block">' +
      '<div class="block-head"><h1>' + b.title + '</h1><p>' + b.intro + '</p><p class="note" style="margin-top:4px">Bloco ' + (bi + 1) + ' de 8</p></div>' +
      body +
      (showErrors[d.id] && missing.length ? '<div class="alert" role="alert" data-state="error" data-aioson-id="quiz-missing"> ' + I.alert + '<div><b>Faltam respostas para concluir</b><ul>' + missing.map(x => '<li><a href="#/diagnostico/' + d.id + '?bloco=' + BLOCKS.indexOf(x) + '">' + x.title + '</a></li>').join('') + '</ul></div></div>' : '') +
      '<div class="quiz-foot">' + (bi > 0 ? '<a class="btn" href="#/diagnostico/' + d.id + '?bloco=' + (bi - 1) + '">' + I.back + 'Bloco anterior</a>' : '<span></span>') +
      (last ? '<button class="btn gate" data-action="diag-finish" data-id="' + d.id + '" data-aioson-id="quiz-finish">Ver meu resultado' + I.arrow + '</button>' : '<a class="btn primary" href="#/diagnostico/' + d.id + '?bloco=' + (bi + 1) + '" data-aioson-id="quiz-next">Próximo bloco' + I.arrow + '</a>') + '</div>' +
    '</section>' +
  '</div>';
}
function viewItem(d, itemId){
  const it = ITEMS[itemId];
  const val = d.answers[itemId];
  const answered = itemId in d.answers;
  return '<fieldset class="item" style="border:0;margin:0" data-aioson-id="item-' + itemId + '"><div class="item-q"><legend style="padding:0"><h2>' + it.q + '</h2></legend><button type="button" class="help-btn" data-action="help" data-target="h-' + itemId + '" aria-expanded="false" aria-controls="h-' + itemId + '" aria-label="O que significa esta pergunta?">?</button></div>' +
    '<p class="help-text" id="h-' + itemId + '" hidden>' + it.help + '</p>' +
    '<div class="opts">' + it.opts.map(([label, v], i) => '<label class="opt' + (v === null ? ' unknown' : '') + '"><input type="radio" name="' + d.id + '-' + itemId + '" data-action="answer" data-diag="' + d.id + '" data-item="' + itemId + '" value="' + (v === null ? 'null' : v) + '"' + (answered && val === v ? ' checked' : '') + '><span>' + label + '</span></label>').join('') + '</div></fieldset>';
}
function moneyInput(id, cents, diagId, key, opts){
  opts = opts || {};
  return '<input class="input money" id="' + id + '" type="text" inputmode="numeric" autocomplete="off" maxlength="18" placeholder="R$ 0,00" value="' + (cents != null ? brl(cents) : '') + '" data-action="money" data-diag="' + diagId + '" data-key="' + key + '"' + (opts.describedby ? ' aria-describedby="' + opts.describedby + '"' : '') + '>';
}
function viewCalc(d){
  const c = d.calc;
  const out = calcOut(c);
  const sig = ratioSignal(out.ratio);
  const radios = (name, cur, opts) => '<div class="mode-row" role="radiogroup">' + opts.map(([v, l]) => '<label><input type="radio" name="' + d.id + '-' + name + '" value="' + v + '" data-action="calc-mode" data-diag="' + d.id + '" data-key="' + name + '"' + (cur === v ? ' checked' : '') + '>' + l + '</label>').join('') + '</div>';
  const spendExact = c.spendMode === 'exact' ? '<div class="spend">' + SPEND_PARTS.map(([k, l]) => '<label for="sp-' + k + '">' + l + '</label>' + moneyInput('sp-' + k, c.spend[k] || null, d.id, 'spend.' + k)).join('') + '<span class="total">Total em 3 meses</span><span class="total mono" id="spend-total">' + brl(out.spend || 0) + '</span></div><p class="hint note" style="margin-top:8px">Deixe em branco o que você não usa. Contar só o anúncio deixa o custo do cliente menor do que é.</p>' : '';
  const spendRange = c.spendMode === 'range' ? '<label class="sr-only" for="sp-range">Faixa de gasto</label><select class="input" id="sp-range" data-action="calc-select" data-diag="' + d.id + '" data-key="spendRange"><option value="">Escolha uma faixa</option>' + SPEND_RANGES.map(([l], i) => '<option value="' + i + '"' + (c.spendRange === i ? ' selected' : '') + '>' + l + '</option>').join('') + '</select>' : '';
  const newExact = c.newMode === 'exact' ? '<input class="input" id="new-exact" type="text" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="Ex.: 40" value="' + (c.newCustomers || '') + '" data-action="int" data-diag="' + d.id + '" data-key="newCustomers" aria-describedby="new-err" style="max-width:180px"><span class="err" id="new-err" hidden></span>' : '';
  const newRange = c.newMode === 'range' ? '<label class="sr-only" for="new-range">Faixa de clientes novos</label><select class="input" id="new-range" style="max-width:240px" data-action="calc-select" data-diag="' + d.id + '" data-key="newRange"><option value="">Escolha uma faixa</option>' + NEW_RANGES.map(([l], i) => '<option value="' + i + '"' + (c.newRange === i ? ' selected' : '') + '>' + l + '</option>').join('') + '</select>' : '';
  const sel = (key, list, cur, label) => '<div class="field"><label for="f-' + key + '">' + label + '</label><select class="input" id="f-' + key + '" data-action="calc-select" data-diag="' + d.id + '" data-key="' + key + '"><option value="">Escolha</option>' + list.map(([l], i) => '<option value="' + i + '"' + (cur === i ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></div>';
  return '<div class="calc" data-aioson-id="cac-ltv-calculator">' +
    '<div>' +
      '<div class="item"><div class="item-q"><h2>Quanto você gastou para atrair clientes nos últimos 3 meses?</h2><button type="button" class="help-btn" data-action="help" data-target="h-spend" aria-expanded="false" aria-controls="h-spend" aria-label="O que entra nesse gasto?">?</button></div><p class="help-text" id="h-spend" hidden>Entra tudo o que você pagou para alguém novo comprar: anúncio, agência, comissão, desconto de primeira compra e a parte do salário de quem vende.</p>' +
        radios('spendMode', c.spendMode, [['exact','Sei os valores'],['range','Sei mais ou menos'],['unknown','Não sei']]) + spendExact + spendRange + '</div>' +
      '<div class="item"><div class="item-q"><h2>Quantos clientes compraram de você pela primeira vez nesses 3 meses?</h2></div>' +
        radios('newMode', c.newMode, [['exact','Sei o número'],['range','Sei mais ou menos'],['unknown','Não sei']]) + newExact + newRange + '</div>' +
      '<div class="item"><div class="item-q"><h2>Como é uma compra típica?</h2></div><div class="grid2" style="margin-top:16px">' +
        '<div class="field"><label for="f-ticket">Valor médio de uma compra</label>' + moneyInput('f-ticket', c.ticket, d.id, 'ticket', {describedby:'ticket-err'}) + '<span class="err" id="ticket-err" hidden></span></div>' +
        sel('freq', FREQ, c.freq, 'Quantas vezes por ano um cliente compra') +
        sel('life', LIFE, c.life, 'Por quanto tempo um cliente continua comprando') +
        '<div class="field"><label for="f-margin">De cada R$ 100 vendidos, quanto sobra depois de pagar produto, insumo e entrega?</label><input class="input" id="f-margin" type="text" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="R$ 35" value="' + (c.margin != null ? 'R$ ' + c.margin : '') + '" data-action="margin" data-diag="' + d.id + '" aria-describedby="margin-err"><span class="err" id="margin-err" hidden></span></div>' +
      '</div></div>' +
    '</div>' +
    '<aside class="calc-out" aria-live="polite" data-aioson-id="calc-output"><h3>Seus números, calculados</h3>' +
      (out.known ? '' : '<p class="note">Sem o gasto ou o número de clientes novos, o app não calcula o custo de um cliente. Tudo bem: isso vira a primeira ação do seu plano.</p>') +
      '<dl>' +
      '<dt>Custo para conquistar um cliente</dt><dd>' + (out.known ? brl(out.cac) : 'não calculado') + '<small>' + (out.known ? 'Gasto ÷ clientes novos' + (out.origin === 'estimado' ? ' (estimado por faixa)' : '') : '') + '</small></dd>' +
      '<dt>Quanto um cliente deixa de lucro</dt><dd>' + (out.ltv != null ? brl(out.ltv) : 'não calculado') + '<small>' + (out.ltv != null ? 'Valor × compras por ano × tempo × margem' : 'Preencha a compra típica') + '</small></dd>' +
      '<dt>Relação entre os dois</dt><dd>' + (out.ratio != null ? out.ratio.toFixed(1).replace('.', ',') + ' vezes' : 'não calculada') + '<small>' + (out.ratio != null ? '<span class="tag ' + sig.cls + '">' + sig.label + '</span> ' + sig.txt : '') + '</small></dd>' +
      '<dt>Tempo para o cliente se pagar</dt><dd>' + (out.payback != null ? Math.ceil(out.payback) + (Math.ceil(out.payback) === 1 ? ' mês' : ' meses') : 'não calculado') + '<small>' + (out.payback != null ? (out.payback <= 12 ? 'Dentro de 12 meses.' : 'Mais de 12 meses: o caixa fica preso.') : '') + '</small></dd>' +
      '</dl></aside></div>';
}

/* ---------- Resultado ---------- */
const transient = {};
function viewResult(id, q){
  const d = diag(id);
  if (!d) return viewNotFound();
  if (d.status === 'draft') { setTimeout(() => go('#/diagnostico/' + d.id), 0); return ''; }
  const c = company(d.companyId);
  if (q.state === 'loading' || transient[id]){
    return '<div data-state="loading" aria-busy="true" data-aioson-id="result-loading"><p class="note">' + esc(c.name) + '</p><h1 style="margin:8px 0 24px">Calculando o seu diagnóstico</h1>' +
      '<div class="plate-wrap"><div class="skeleton" style="height:300px"></div><div><div class="skeleton" style="height:56px;width:70%"></div><div class="skeleton" style="height:20px;margin-top:16px"></div><div class="skeleton" style="height:20px;width:80%;margin-top:8px"></div><div class="skeleton" style="height:84px;margin-top:24px"></div></div></div>' +
      '<p class="note" style="margin-top:16px">Comparando as respostas com as regras ' + RULES + '. Leva poucos segundos.</p></div>';
  }
  const ev = evaluate(d);
  const prev = prevDone(d);
  const evPrev = prev ? evaluate(prev) : null;
  const st = STAGES[ev.stage - 1];
  const dimRow = (k) => {
    const v = ev.dims[k];
    const lvl = v.score < 40 ? 1 : v.score < 60 ? 2 : v.score < 80 ? 3 : 4;
    return '<div class="dim" data-aioson-id="dim-' + k + '"><div class="dim-head"><div><div class="dim-name">' + DIMS[k].name + '</div><div class="dim-lay">' + DIMS[k].lay + '</div></div><div class="dim-score">' + v.score + '</div></div>' +
      '<div class="bar' + (v.score < 50 ? ' low' : '') + '" role="img" aria-label="' + v.score + ' de 100"><i style="--w:' + v.score + '%"></i></div>' +
      '<div class="dim-foot"><span class="tag">Sustentaria o estágio ' + lvl + '</span>' + (v.score < 50 ? '<span class="tag warn">' + I.alert + 'Abaixo de 50</span>' : '') + (v.unknown ? '<span class="tag">' + v.unknown + (v.unknown === 1 ? ' resposta' : ' respostas') + ' "não sei"</span>' : '') + '</div></div>';
  };
  const sig = ratioSignal(ev.calc.ratio);
  const lvlTag = (sc) => sc >= 16 ? '<span class="tag danger">' + I.alert + 'Alto · ' + sc + '</span>' : sc >= 6 ? '<span class="tag warn">Médio · ' + sc + '</span>' : '<span class="tag">Baixo · ' + sc + '</span>';
  return '' +

function viewCompare(id){
  const d = diag(id);
  if (!d) return viewNotFound();
  const p = prevDone(d);

  const row = (k) => { const x = a.dims[k].score, y = b.dims[k].score, dl = y - x; return '<div class="cmp-row"><div><b>' + DIMS[k].name + '</b><div class="note">' + DIMS[k].lay + '</div></div><div class="v">' + x + '</div><div class="v">' + y + '</div><div><span class="delta ' + (dl > 0 ? 'up' : dl < 0 ? 'down' : 'same') + '">' + (dl > 0 ? I.up : dl < 0 ? I.down : I.same) + (dl > 0 ? '+' : '') + dl + (dl > 0 ? ' subiu' : dl < 0 ? ' caiu' : ' igual') + '</span></div></div>'; };
  const resolved = a.risks.filter(r => !b.risks.some(x => x.id === r.id));
  const fresh = b.risks.filter(r => !a.risks.some(x => x.id === r.id));
  return '' +
  '<div class="crumb"><a href="#/empresa/' + c.id + '">' + esc(c.name) + '</a></div>' +
  '<div class="page-head"><div><h1>De ' + monthName(p.createdAt) + ' para ' + monthName(d.createdAt) + '</h1><p class="sub">' + dateBR(p.createdAt) + ' → ' + dateBR(d.createdAt) + ' · ' + (daysSince(p.createdAt) - daysSince(d.createdAt)) + ' dias entre os dois</p></div><a class="btn" href="#/resultado/' + d.id + '">Ver resultado de ' + monthName(d.createdAt) + '</a></div>' +

  '<div class="plate-wrap rise" style="--i:0">' + escada({stage: b.stage, prev: a.stage, lock: b.lock, primary: true, caption: '<span>Estágio em ' + dateShort(d.createdAt) + '</span><span>Antes: estágio ' + a.stage + ' em ' + monthName(p.createdAt) + '</span>'}) +
  '<div><h2 class="stage-title">' + STAGES[a.stage-1].name + ' → ' + STAGES[b.stage-1].name + '</h2><p class="stage-why"><b>' + (b.stage > a.stage ? 'Subiu de degrau.' : b.stage < a.stage ? 'Desceu de degrau.' : 'Mesmo degrau.') + '</b> Média das 8 dimensões: ' + a.avg + ' → ' + b.avg + ' pontos.</p></div></div>' +
  '<div class="pauta" aria-hidden="true"></div><h2 style="margin:0 0 12px">Dimensão por dimensão</h2><div data-aioson-id="compare-table"><div class="cmp-row head"><div>Dimensão</div><div>' + MONTHS[parseISO(p.createdAt).getMonth()] + '</div><div>' + MONTHS[parseISO(d.createdAt).getMonth()] + '</div><div>Mudança</div></div>' + Object.keys(DIMS).map(row).join('') + '</div>' +
  '<div class="cols"><section><h2 style="margin-bottom:12px">Riscos resolvidos</h2>' + (resolved.length ? '<ul class="rule-list">' + resolved.map(r => '<li><span class="tag ok">' + I.check + 'Resolvido</span> ' + r.title + '</li>').join('') + '</ul>' : '<p class="note">Nenhum risco deixou de existir.</p>') + '</section>' +
  '<section><h2 style="margin-bottom:12px">Riscos novos</h2>' + (fresh.length ? '<ul class="rule-list">' + fresh.map(r => '<li><span class="tag warn">Novo</span> ' + r.title + '</li>').join('') + '</ul>' : '<p class="note">Nenhum risco novo.</p>') + '</section></div>';
}

/* ---------- Masks & validation ---------- */
function cnpjDigits(s){ return (s || '').replace(/\D/g, '').slice(0, 14); }
function cnpjMask(s){ const d = cnpjDigits(s); let o = d.slice(0,2); if (d.length > 2) o += '.' + d.slice(2,5); if (d.length > 5) o += '.' + d.slice(5,8); if (d.length > 8) o += '/' + d.slice(8,12); if (d.length > 12) o += '-' + d.slice(12,14); return o; }
function cnpjValid(s){
  const d = cnpjDigits(s);
  if (d.length !== 14 || /^(\d)\1+$/.test(d)) return false;
  const calc = (len) => { const w = len === 12 ? [5,4,3,2,9,8,7,6,5,4,3,2] : [6,5,4,3,2,9,8,7,6,5,4,3,2]; let sum = 0; for (let i = 0; i < len; i++) sum += Number(d[i]) * w[i]; const r = sum % 11; return r < 2 ? 0 : 11 - r; };
  return calc(12) === Number(d[12]) && calc(13) === Number(d[13]);
}
function moneyCents(s){ const d = (s || '').replace(/\D/g, '').slice(0, 13); return d ? parseInt(d, 10) : null; }
function clearInlineError(el){
  el.removeAttribute('aria-invalid');
  const field = el.closest('.field');
  const err = field && field.querySelector('.err');
  if (err){ err.hidden = true; err.textContent = ''; }
  if (wizard.errors && el.name) delete wizard.errors[el.name];
}
function setFieldError(input, msg){
  const errId = input.getAttribute('aria-describedby');
  const err = errId ? document.getElementById(errId.split(' ')[0]) : null;
  if (msg){ input.setAttribute('aria-invalid', 'true'); input.classList.remove('is-valid'); if (err){ err.hidden = false; err.innerHTML = I.alert + msg; } }
  else { input.removeAttribute('aria-invalid'); if (err){ err.hidden = true; err.textContent = ''; } }
}

function openModal({title, body, actions, wide, id}){

  root.innerHTML = '<div class="backdrop" data-modal-backdrop><div class="modal' + (wide ? ' wide' : '') + '" role="dialog" aria-modal="true" aria-labelledby="m-title"' + (id ? ' data-aioson-id="' + id + '"' : '') + '><h2 id="m-title">' + title + '</h2>' + body + '<div class="modal-foot">' + actions.map((a, i) => '<button class="btn ' + (a.kind || '') + '" data-modal-act="' + i + '"' + (a.submit ? ' type="submit" form="' + a.submit + '"' : ' type="button"') + '>' + a.label + '</button>').join('') + '</div></div></div>';
  const modal = root.querySelector('.modal');
  root.querySelectorAll('[data-modal-act]').forEach(btn => btn.addEventListener('click', (e) => { const a = actions[+btn.dataset.modalAct]; if (a.submit) return; e.preventDefault(); if (a.onClick) a.onClick(); else closeModal(); }));
  root.querySelector('[data-modal-backdrop]').addEventListener('mousedown', (e) => { if (e.target.matches('[data-modal-backdrop]')) closeModal(); });
  const focusables = () => [...modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')].filter(el => !el.disabled && el.offsetParent !== null);
  modal.addEventListener('keydown', (e) => {
    if (e.key === 'Escape'){ e.preventDefault(); closeModal(); }
    if (e.key === 'Tab'){ const f = focusables(); if (!f.length) return; const first = f[0], last = f[f.length - 1]; if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); } }
  });
  const f = focusables();
  const cancel = [...modal.querySelectorAll('[data-modal-act]')][0];
  (modal.querySelector('input,select') || cancel || f[0]).focus();
  return modal;
}
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
function confirmModal({title, consequence, verb, danger, gate, onConfirm}){
  openModal({title, body:'<p class="consequence">' + consequence + '</p>', actions:[{label:'Cancelar'}, {label:verb, kind: danger ? 'danger' : (gate ? 'gate' : 'primary'), onClick: () => { closeModal(); onConfirm(); }}]});
}
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = I.check + '<span>' + msg + '</span>';
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => t.remove(), 3600);
}

/* ---------- Company form modal ---------- */
function companyModal(existing){
  let data = existing ? {name:existing.name, segment:existing.segment, model:existing.model, revenue:existing.revenue, cnpj:existing.cnpj} : {name:'', segment:'', model:'', revenue:'', cnpj:''};
  const draw = (errors) => {
    openModal({title: existing ? 'Editar ' + esc(existing.name) : 'Nova empresa', id: existing ? 'company-edit-modal' : 'company-create-modal', wide:true,
      body:'<form id="company-form" novalidate style="margin-top:16px">' + companyFormFields(data, errors || {}, 'm-') + '</form>',
      actions:[{label:'Cancelar'}, {label: existing ? 'Salvar alterações' : 'Cadastrar empresa', kind:'primary', submit:'company-form'}]});
    const form = document.getElementById('company-form');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      data = readCompanyForm(form);
      const errs = validateCompany(data);
      if (Object.keys(errs).length){ draw(errs); const firstBad = document.querySelector('#company-form [aria-invalid="true"]'); if (firstBad) firstBad.focus(); return; }
      if (existing){ Object.assign(existing, data, {revenue: data.revenue === '' ? '' : +data.revenue}); closeModal(); toast('Dados de ' + esc(existing.name) + ' salvos.'); render(); }
      else { const c = Object.assign({id: uid('c'), archived:false}, data, {revenue: data.revenue === '' ? '' : +data.revenue}); S.companies.push(c); closeModal(); toast(esc(c.name) + ' cadastrada.'); go('#/empresa/' + c.id); }
    });
  };
  draw({});
}
function readCompanyForm(form){
  const fd = new FormData(form);
  return {name:(fd.get('name') || '').trim(), segment:fd.get('segment') || '', model:fd.get('model') || '', revenue:fd.get('revenue') || '', cnpj:cnpjMask(fd.get('cnpj') || '')};
}
function validateCompany(d){
  const e = {};
  if (!d.name) e.name = 'Informe o nome da empresa.';
  else if (d.name.length < 2) e.name = 'O nome precisa ter pelo menos 2 letras.';
  if (!d.segment) e.segment = 'Escolha o segmento mais próximo.';
  if (!d.model) e.model = 'Escolha como você vende.';
  if (d.cnpj && !cnpjValid(d.cnpj)) e.cnpj = 'CNPJ inválido. Formato: 00.000.000/0000-00.';
  return e;
}

/* ---------- Diagnosis lifecycle ---------- */
function newDiagnosis(companyId){
  const last = lastDone(companyId);
  const d = {id: uid('d'), companyId, createdAt:'2026-10-22', updatedAt:'2026-10-22', completedAt:null, status:'draft', rules:RULES, block:0, answers: last ? clone(last.answers) : {}, calc: last ? clone(last.calc) : {spendMode:null, spend:{}, newMode:null, ticket:null, freq:null, life:null, margin:null}};
  S.diagnoses.push(d);
  return d;
}
function touch(d){ d.updatedAt = '2026-10-22'; d.savedAt = nowTime(); const s = document.getElementById('saved'); if (s) s.innerHTML = I.check + 'Salvo automaticamente às ' + d.savedAt; }

/* ---------- PDF / import ---------- */
