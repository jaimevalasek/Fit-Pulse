      '<p style="margin:16px 0 8px;font-weight:700;letter-spacing:-.02em;font-size:1.75rem">Estágio ' + ev.stage + ' · ' + STAGES[ev.stage-1].name + '</p>' + (ev.lock ? '<p>Para subir: ' + LOCKS[ev.lock] + '.</p>' : '') +
      '<div style="margin-top:16px">' + Object.keys(DIMS).map(k => '<div class="r-row"><span>' + DIMS[k].name + '</span><b>' + ev.dims[k].score + '</b></div>').join('') + '</div>' +
      '<p style="margin-top:16px"><b>Próximas ações</b></p><ol style="margin:4px 0 0;padding-left:20px">' + ev.actions.map(k => '<li>' + ACTIONS[k].t + '</li>').join('') + '</ol>' +
      '<p class="note" style="margin-top:16px">Orientação baseada nas respostas. Não substitui uma análise financeira.</p></div>',
    actions:[{label:'Fechar'}, {label:'Salvar PDF', kind:'primary', onClick: () => { closeModal(); toast('PDF salvo: ' + c.name.toLowerCase().replace(/\s+/g,'-').normalize('NFD').replace(/[̀-ͯ]/g,'') + '-' + d.createdAt + '.pdf (simulado no protótipo).'); }}]});
}
function importModal(){
  openModal({title:'Importar uma cópia', id:'import-modal',
    body:'<p class="consequence">Escolha o arquivo exportado pelo FitPulse. Os dados importados entram junto com os atuais: nada é apagado.</p><div class="choice-grid" style="margin-top:16px;grid-template-columns:1fr" role="radiogroup" aria-label="Arquivos de exemplo"><label class="choice"><input type="radio" name="imp" value="ok" checked><div><b>fitpulse-copia-2026-09-30.json</b><span>Exemplo de arquivo válido</span></div></label><label class="choice"><input type="radio" name="imp" value="error"><div><b>fitpulse-copia-regras-v2.json</b><span>Exemplo de arquivo de uma versão mais nova</span></div></label></div>',
    actions:[{label:'Cancelar'}, {label:'Importar', kind:'primary', onClick: () => { const v = document.querySelector('input[name="imp"]:checked').value; importResult = v; exportDone = false; closeModal(); if (v === 'ok') toast('Cópia importada.'); render(); }}]});
}

/* ---------- Events ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const act = el.dataset.action;
  if (['answer','calc-mode','set-mode','set-theme','money','int','margin','cnpj','search','calc-select','set-own','wizard-submit'].includes(act)) return;
  e.preventDefault();
  const id = el.dataset.id;
  switch (act){
    case 'tour-open': if ((route().parts[0] || 'inicio') !== 'inicio'){ go('#/inicio'); setTimeout(() => openTour(), 60); } else openTour(); break;
    case 'theme-toggle': S.theme = S.theme === 'light' ? 'dark' : 'light'; applyTheme(); if ((route().parts[0] || '') === 'configuracoes') render(); break;
    case 'help': { const t = document.getElementById(el.dataset.target); const open = t.hidden; t.hidden = !open; el.setAttribute('aria-expanded', String(open)); break; }
    case 'wizard-mode': wizard.mode = el.dataset.mode; go('#/boas-vindas/empresa'); break;
    case 'company-new': companyModal(null); break;
    case 'company-edit': companyModal(company(id)); break;
    case 'company-archive': { const c = company(id); confirmModal({title:'Arquivar ' + esc(c.name) + '?', consequence:'A empresa sai da carteira e da tela inicial. O histórico fica guardado e você pode restaurá-la quando quiser.', verb:'Arquivar empresa', onConfirm: () => { c.archived = true; if (S.ownCompanyId === c.id) S.ownCompanyId = (S.companies.find(x => !x.archived) || {}).id; toast(esc(c.name) + ' arquivada.'); render(); }}); break; }
    case 'company-restore': { const c = company(id); c.archived = false; toast(esc(c.name) + ' restaurada.'); render(); break; }
    case 'company-delete': { const c = company(id); const n = S.diagnoses.filter(d => d.companyId === id).length; confirmModal({title:'Excluir ' + esc(c.name) + '?', consequence:'A empresa e ' + n + (n === 1 ? ' diagnóstico' : ' diagnósticos') + ' serão apagados deste computador. Não dá para desfazer. Se quiser guardar, exporte uma cópia antes em Configurações.', verb:'Excluir definitivamente', danger:true, onConfirm: () => { S.companies = S.companies.filter(x => x.id !== id); S.diagnoses = S.diagnoses.filter(d => d.companyId !== id); toast(esc(c.name) + ' excluída.'); go('#/empresas?arquivadas=1'); }}); break; }
    case 'diag-new': { const d = newDiagnosis(el.dataset.company); toast(lastDone(d.companyId) ? 'Novo diagnóstico com as respostas anteriores já preenchidas.' : 'Diagnóstico iniciado.'); go('#/diagnostico/' + d.id); break; }
    case 'diag-discard': { const d = diag(id); confirmModal({title:'Descartar o rascunho de ' + dateBR(d.createdAt) + '?', consequence:'As respostas deste rascunho serão apagadas. Os diagnósticos concluídos não mudam.', verb:'Descartar rascunho', danger:true, onConfirm: () => { S.diagnoses = S.diagnoses.filter(x => x.id !== id); toast('Rascunho descartado.'); render(); }}); break; }
    case 'diag-archive': { const d = diag(id); confirmModal({title:'Arquivar o diagnóstico de ' + dateBR(d.createdAt) + '?', consequence:'Ele sai da linha do tempo e das comparações. Fica guardado em "Diagnósticos arquivados" e pode ser restaurado.', verb:'Arquivar diagnóstico', onConfirm: () => { d.status = 'archived'; toast('Diagnóstico arquivado.'); render(); }}); break; }
    case 'diag-restore': { const d = diag(id); d.status = 'done'; toast('Diagnóstico restaurado.'); render(); break; }
    case 'diag-finish': {
      const d = diag(id);
      const missing = BLOCKS.filter(x => !blockDone(d, x));
      if (missing.length){ showErrors[d.id] = true; render(); const al = document.querySelector('[data-aioson-id="quiz-missing"]'); if (al) al.scrollIntoView({block:'center'}); return; }
      confirmModal({title:'Concluir o diagnóstico?', consequence:'Depois de concluído, as respostas ficam guardadas como estão e o resultado não muda. Para mudar algo, você faz um novo diagnóstico.', verb:'Concluir e ver resultado', gate:true, onConfirm: () => { d.status = 'done'; d.completedAt = '2026-10-22'; transient[d.id] = true; go('#/resultado/' + d.id); setTimeout(() => { delete transient[d.id]; if (route().parts[1] === d.id) render(); }, 900); }});
      break;
    }
    case 'pdf': pdfModal(diag(id)); break;
    case 'export': exportDone = true; importResult = null; toast('Cópia salva (simulado).'); render(); break;
    case 'import': importModal(); break;
    case 'reset': confirmModal({title:'Recomeçar do zero?', consequence:'Apaga todas as empresas e diagnósticos de demonstração e abre o assistente de primeiro uso.', verb:'Recomeçar', danger:true, onConfirm: () => { S = {mode:'empresa', theme:S.theme, ownCompanyId:null, tourDone:true, companies:[], diagnoses:[]}; wizard = {mode:null, errors:{}, data:{name:'', segment:'', model:'', revenue:'', cnpj:''}}; go('#/boas-vindas'); }}); break;
  }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  const act = el.dataset.action;
  if (act === 'answer'){
    const d = diag(el.dataset.diag);
    d.answers[el.dataset.item] = el.value === 'null' ? null : +el.value;
    touch(d);
    const dot = document.querySelector('.rail [aria-current="step"] .dot');
    if (dot && blockDone(d, BLOCKS[d.block])){ dot.classList.add('done'); }
  }
  if (act === 'calc-mode'){ const d = diag(el.dataset.diag); d.calc[el.dataset.key] = el.value; if (el.value === 'exact' && el.dataset.key === 'spendMode') d.calc.spend = d.calc.spend || {}; touch(d); rerenderKeep(); }
  if (act === 'calc-select'){ const d = diag(el.dataset.diag); d.calc[el.dataset.key] = el.value === '' ? null : +el.value; touch(d); rerenderKeep(el.id); }
  if (act === 'set-mode'){ S.mode = el.value; if (S.mode === 'empresa' && !S.ownCompanyId) S.ownCompanyId = (S.companies.find(c => !c.archived) || {}).id; toast(S.mode === 'consultoria' ? 'Modo consultoria ativado.' : 'Modo minha empresa ativado.'); render(); }
  if (el.closest && el.closest('#wizard-form, #company-form')){ const fs2 = el.closest('fieldset.field'); if (el.type === 'radio' && fs2){ const er = fs2.querySelector('.err'); if (er){ er.hidden = true; er.textContent = ''; } if (wizard.errors) delete wizard.errors[el.name]; } else if (el.getAttribute('aria-invalid') === 'true') clearInlineError(el); }
  if (act === 'set-theme'){ S.theme = el.value; applyTheme(); }
  if (act === 'set-own'){ S.ownCompanyId = el.value; toast('Empresa em foco alterada.'); }
});
document.addEventListener('input', (e) => {
  const el = e.target;
  const act = el.dataset.action;
  if (act === 'money'){
    const cents = moneyCents(el.value);
    el.value = cents == null ? '' : brl(cents);
    const d = diag(el.dataset.diag);
    const key = el.dataset.key;
    if (key.startsWith('spend.')) d.calc.spend[key.split('.')[1]] = cents || 0; else d.calc[key] = cents;
    touch(d);
    updateCalcOut(d);
  }
  if (act === 'int'){
    const digits = el.value.replace(/\D/g, '').slice(0, 6);
    el.value = digits;
    const d = diag(el.dataset.diag);
    d.calc[el.dataset.key] = digits ? parseInt(digits, 10) : null;
    touch(d); updateCalcOut(d);
  }
  if (act === 'margin'){
    const digits = el.value.replace(/\D/g, '').slice(0, 3);
    el.value = digits ? 'R$ ' + digits : '';
    const d = diag(el.dataset.diag);
    d.calc.margin = digits ? parseInt(digits, 10) : null;
    touch(d); updateCalcOut(d);
  }
  if (act === 'cnpj'){ el.value = cnpjMask(el.value); el.classList.remove('is-valid'); }
  if (el.closest && el.closest('#wizard-form, #company-form') && el.getAttribute('aria-invalid') === 'true' && el.dataset.action !== 'cnpj'){ clearInlineError(el); }
  if (act === 'search'){ clearTimeout(window.__s); window.__s = setTimeout(() => { const q = route().q; q.busca = el.value; const qs = new URLSearchParams(Object.entries(q).filter(([,v]) => v)).toString(); history.replaceState(null, '', '#/empresas' + (qs ? '?' + qs : '')); app.innerHTML = viewCompanies(q); afterRender('empresas', route()); const s = document.getElementById('busca'); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }, 220); }
});
document.addEventListener('blur', (e) => {
  const el = e.target;
  if (!el.dataset) return;
  // Foco indo direto para enviar/avançar: a validação do envio cuida disso, sem deslocar o botão no meio do clique.
  const next = e.relatedTarget;
  if (next && (next.type === 'submit' || (next.closest && next.closest('.form-foot, .modal-foot, .quiz-foot')))) return;
  const act = el.dataset.action;
  if (act === 'cnpj'){
    if (!el.value) setFieldError(el, null);
    else if (!cnpjValid(el.value)) setFieldError(el, 'CNPJ inválido. Formato: 00.000.000/0000-00.');
    else { setFieldError(el, null); el.classList.add('is-valid'); }
  }
  if (act === 'money' && el.dataset.key === 'ticket'){ setFieldError(el, el.value ? null : 'Informe o valor médio em reais, por exemplo R$ 45,00.'); }
  if (act === 'int'){ setFieldError(el, el.value && +el.value > 0 ? null : 'Informe quantos clientes compraram pela primeira vez, só números. Ex.: 40.'); }
  if (act === 'margin'){ const v = parseInt((el.value || '').replace(/\D/g,''), 10); setFieldError(el, !el.value ? 'Informe quanto sobra de cada R$ 100, por exemplo R$ 35.' : v > 100 ? 'O valor precisa estar entre R$ 0 e R$ 100.' : null); }
}, true);
document.addEventListener('submit', (e) => {
  const form = e.target;
  if (form.id !== 'wizard-form') return;
  e.preventDefault();
  wizard.data = readCompanyForm(form);
  wizard.errors = validateCompany(wizard.data);
  if (Object.keys(wizard.errors).length){ render(); const bad = document.querySelector('#wizard-form [aria-invalid="true"]'); if (bad) bad.focus(); return; }
  const c = Object.assign({id: uid('c'), archived:false}, wizard.data, {revenue: wizard.data.revenue === '' ? '' : +wizard.data.revenue});
  S.companies.push(c);
  S.mode = wizard.mode || 'empresa';
  if (S.mode === 'empresa') S.ownCompanyId = c.id;
  const d = newDiagnosis(c.id);
  toast(esc(c.name) + ' cadastrada. Vamos ao diagnóstico.');
  go('#/diagnostico/' + d.id);
});
function rerenderKeep(focusId){ const y = window.scrollY; const r = route(); app.innerHTML = viewQuiz(r.parts[1], r.q); window.scrollTo(0, y); if (focusId){ const f = document.getElementById(focusId); if (f) f.focus(); } }
function updateCalcOut(d){
  const box = document.querySelector('[data-aioson-id="calc-output"]');
  if (!box) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = viewCalc(d);
  box.replaceWith(tmp.querySelector('[data-aioson-id="calc-output"]'));
  const tot = document.getElementById('spend-total');
  if (tot) tot.textContent = brl(calcOut(d.calc).spend || 0);
  const dot = document.querySelector('.rail [aria-current="step"] .dot');
  if (dot && blockDone(d, BLOCKS[0])){ dot.classList.add('done'); }
}

/* ---------- Tour ---------- */
const TOURS = {
  empresa:[
    ['escada','Este é o degrau da sua empresa','São quatro estágios, de Descoberta a Estruturação. O degrau tracejado mostra onde você estava no diagnóstico anterior.'],
    ['trava','O cadeado mostra o que segura você','Antes de investir mais, resolva esta trava. Ela vem das respostas mais fracas do diagnóstico.'],
    ['acoes','Três ações para os próximos 30 dias','Elas são escolhidas pelas suas respostas, não por uma lista genérica.'],
    ['rascunho','Pare quando quiser','O questionário salva cada resposta. Você continua de onde parou, mesmo dias depois.'],
    ['nav','Configurações e modo consultoria','Em Configurações você troca para o modo de várias empresas e guarda uma cópia dos seus dados.']
  ],
  consultoria:[
    ['carteira','Sua carteira em degraus','Cada degrau mostra quantas empresas estão naquele estágio. Toque num degrau para ver a lista.'],
    ['parados','Rascunhos parados','Clientes que começaram o diagnóstico e não terminaram aparecem aqui.'],
    ['antigos','Hora de refazer','Empresas sem diagnóstico há mais de 90 dias. Refazer mostra se as ações funcionaram.'],
    ['nav','Empresas e configurações','Em Empresas você cadastra, edita e arquiva clientes. Em Configurações, faz a cópia de segurança.']
  ]
};
let tourIdx = 0, tourOn = false;
function openTour(){ tourOn = true; tourIdx = 0; drawTour(); }
function closeTour(silent){ document.getElementById('tour-root').innerHTML = ''; if (tourOn && !silent){ S.tourDone = true; } tourOn = false; window.removeEventListener('resize', drawTourPos); }
function drawTourPos(){ if (tourOn) drawTour(); }
function drawTour(){
  const steps = TOURS[S.mode] || TOURS.empresa;
  const [anchor, title, text] = steps[tourIdx];
  const target = document.querySelector('[data-aioson-tour="' + anchor + '"]');
  const root = document.getElementById('tour-root');
  if (!target){ closeTour(); return; }
  target.scrollIntoView({block:'center', behavior:'instant'});
  const r = target.getBoundingClientRect();
  const pad = 8;
  const cardW = Math.min(360, window.innerWidth - 32);
  let top = r.bottom + 16, left = Math.min(Math.max(16, r.left), window.innerWidth - cardW - 16);
  if (top + 220 > window.innerHeight) top = Math.max(16, r.top - 236);
  root.innerHTML = '<div class="tour-hole" style="top:' + (r.top - pad) + 'px;left:' + (r.left - pad) + 'px;width:' + (r.width + pad*2) + 'px;height:' + (r.height + pad*2) + 'px"></div>' +
    '<div class="tour-card" role="dialog" aria-modal="false" aria-labelledby="tour-title" style="top:' + top + 'px;left:' + left + 'px" data-aioson-id="tour-card"><div class="count">' + (tourIdx + 1) + ' de ' + steps.length + '</div><h2 id="tour-title">' + title + '</h2><p>' + text + '</p>' +
    '<div class="row"><button class="btn ghost" type="button" data-tour="close">Pular o tour</button><div style="display:flex;gap:8px">' + (tourIdx > 0 ? '<button class="btn" type="button" data-tour="prev">Voltar</button>' : '') + '<button class="btn primary" type="button" data-tour="next">' + (tourIdx === steps.length - 1 ? 'Entendi' : 'Próximo') + '</button></div></div></div>';
  root.querySelectorAll('[data-tour]').forEach(b => b.addEventListener('click', () => {
    const a = b.dataset.tour;
    if (a === 'close' || (a === 'next' && tourIdx === steps.length - 1)) closeTour();
    else { tourIdx += a === 'next' ? 1 : -1; drawTour(); }
  }));
  root.querySelector('[data-tour="next"]').focus({preventScroll:true});
  window.removeEventListener('resize', drawTourPos);
  window.addEventListener('resize', drawTourPos);
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && tourOn) closeTour(); });

/* ---------- After render ---------- */
function observeReveals(){
  const els = [...document.querySelectorAll('[data-reveal]:not(.in)')];
  if (!els.length) return;
  if (!('IntersectionObserver' in window) || window.matchMedia('(prefers-reduced-motion: reduce)').matches){ els.forEach(el => el.classList.add('in')); return; }
  const io = new IntersectionObserver((entries) => { entries.forEach(en => { if (en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } }); }, {threshold:0.2});
  els.forEach(el => io.observe(el));
}
function afterRender(first, r){
  observeReveals();
  if (first === 'inicio' && !S.tourDone && !r.q.state){ setTimeout(() => { if (!S.tourDone && (route().parts[0] || 'inicio') === 'inicio') openTour(); }, 350); }
  if (first !== 'configuracoes'){ importResult = null; exportDone = false; }
}

function applyTheme(){ document.documentElement.dataset.theme = S.theme === 'light' ? 'light' : 'dark'; }
window.addEventListener('hashchange', render);
applyTheme();
render();
})();
