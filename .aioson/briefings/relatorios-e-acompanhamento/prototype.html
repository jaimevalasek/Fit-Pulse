    <div class="dialog-actions"><button class="btn" data-act="dlg-cancel">Cancelar</button><button class="btn" data-act="copy-msg">Copiar mensagem</button><button class="btn btn-primary" data-act="send-go" autofocus data-aioson-id="send-generate">Gerar arquivo</button></div>`);
}
function openImport(coId,stage,file){
  const c=co(coId); S.dlgCtx={coId,file};
  const title=`<h2 id="dlg-title">Importar respostas de ${esc(c.name)}</h2>`;
  if(stage==="pick"||!stage){
    openDialog(title+`<p class="consequence">Escolha o arquivo de respostas que o cliente devolveu. Ele vira um rascunho para você revisar e concluir.</p>
      <p class="muted" style="font-size:.8125rem;margin-bottom:8px">Só no protótipo: arquivos de exemplo da pasta Downloads.</p>
      <ul class="rows">${IMPORT_FILES.map((f,i)=>`<li><button class="btn btn-text" style="width:100%;justify-content:flex-start;min-height:48px;color:var(--text)" data-act="import-pick" data-i="${i}">${I.file}<span style="text-align:left"><span class="mono" style="font-size:.875rem">${esc(f.name)}</span><span class="muted" style="display:block;font-weight:400;font-size:.8125rem">recebido em ${fmtDate(f.when)}</span></span></button></li>`).join("")}</ul>
      <div class="dialog-actions"><button class="btn" data-act="dlg-cancel">Cancelar</button></div>`); return; }
  if(stage==="reading"){ openDialog(title+`<div class="busy is-loading" aria-busy="true" role="status"><span class="spinner"></span>Lendo o arquivo…</div>`,{busy:true,state:"loading"}); return; }
  if(stage==="ok"){ openDialog(title+`<div class="result-mark ok success-state" data-state="success">${I.check}<div><b>Rascunho criado</b><p class="soft" style="margin-top:4px">As respostas que ${esc(c.name)} salvou em ${fmtDate(file.when)} viraram um rascunho. Revise com o cliente e conclua o diagnóstico.</p></div></div>
      <div class="dialog-actions"><button class="btn" data-act="dlg-done">Fechar</button><button class="btn btn-primary" data-act="review-draft" autofocus>Revisar e concluir</button></div>`,{state:"success"}); return; }
  const msgs={other:`Este arquivo é de ${esc(file.co?co(file.co).name:"outra empresa")}, não de ${esc(c.name)}.`,newer:"Este arquivo foi feito por uma versão mais nova do FitPulse. Atualize o app pelo Play e importe de novo.",invalid:"Este arquivo não é um arquivo de respostas do FitPulse."};
  openDialog(title+`<div class="result-mark bad error-state" role="alert" data-state="error">${I.alert}<div><b>Não foi possível importar</b><p class="soft" style="margin-top:4px">${msgs[stage]} Nada foi alterado.</p></div></div>
    <div class="dialog-actions"><button class="btn" data-act="dlg-cancel">Fechar</button><button class="btn btn-primary" data-act="import-again">Escolher outro arquivo</button></div>`,{state:"error"});
}
function doImport(coId,file){
  closeDialog(true); openImport(coId,"reading",file);
  setTimeout(()=>{ S.dlgBusy=false; closeDialog(true);
    let res="ok"; if(file.kind==="invalid") res="invalid"; else if(file.kind==="newer") res="newer"; else if(file.co!==coId) res="other";
    if(res==="ok"){ S.drafts[coId]={date:TODAY,sentAt:file.when}; S.sent=S.sent.filter(s=>s.co!==coId); render(); }
    openImport(coId,res,file);
  },700);
}

/* ============ Toast ============ */
function toast(msg,undo){
  const el=document.createElement("div"); el.className="toast"; el.innerHTML=`<span>${esc(msg)}</span>${undo?'<button class="btn btn-text">Desfazer</button>':""}`;
  if(undo) el.querySelector("button").onclick=()=>{ undo(); el.remove(); };
  const box=$("#toasts"); while(box.children.length>=2) box.firstElementChild.remove(); box.appendChild(el); setTimeout(()=>el.remove(),undo?6000:3200);
}

/* ============ Máscaras ============ */
function maskValue(kind,v){
  const d=v.replace(/\D/g,"");
  if(kind==="money"){ const t=d.replace(/^0+/,"").slice(0,10); if(!t) return ""; return (parseInt(t,10)/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
  if(kind==="int") return d.slice(0,5);
  if(kind==="date"){ const x=d.slice(0,8); return x.length>4?x.slice(0,2)+"/"+x.slice(2,4)+"/"+x.slice(4):x.length>2?x.slice(0,2)+"/"+x.slice(2):x; }
  if(kind==="month"){ const x=d.slice(0,6); return x.length>2?x.slice(0,2)+"/"+x.slice(2):x; }
  if(kind==="phone"){ const x=d.slice(0,11); if(x.length<=2) return x.length?"("+x:""; if(x.length<=6) return "("+x.slice(0,2)+") "+x.slice(2); if(x.length<=10) return "("+x.slice(0,2)+") "+x.slice(2,6)+"-"+x.slice(6); return "("+x.slice(0,2)+") "+x.slice(2,7)+"-"+x.slice(7); }
  return v;
}
const parseMoney = v=>v?parseInt(v.replace(/\D/g,""),10):0;
function parseDateBR(v){ const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(v); if(!m) return null; const [_,dd,mm,yy]=m; const dt=new Date(+yy,+mm-1,+dd); if(dt.getFullYear()!==+yy||dt.getMonth()!==+mm-1||dt.getDate()!==+dd) return null; return yy+"-"+mm+"-"+dd; }
function validPhone(v){ const d=v.replace(/\D/g,""); return d.length===10||d.length===11; }
function validEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v); }
function validSite(v){ return /^(https?:\/\/)?[a-z0-9-]+(\.[a-z0-9-]+)+(\/\S*)?$/i.test(v.trim()); }

document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.mask){ t.value=maskValue(t.dataset.mask,t.value); }
  if(t.dataset.counter){ const c=$("#"+t.dataset.counter); if(c) c.textContent=t.value.length; }
  if(t.dataset.input==="brand"){ S.brandForm[t.name]=t.value; if(S.brandForm.errors[t.name]){ S.brandForm.errors[t.name]=""; const f=t.closest(".field"); f.classList.remove("has-error"); t.removeAttribute("aria-invalid"); $("#e-"+t.name).textContent=""; } }
  if(t.dataset.input==="cq-spend"){ CQ.spend=t.value; if(CQ.err){ CQ.err=""; t.closest(".field").classList.remove("has-error"); t.removeAttribute("aria-invalid"); $("#e-cq").textContent=""; } }
  if(t.dataset.input==="cq-cust"){ CQ.customers=t.value; }
  if(t.id&&t.closest("#month-form")){ const map={"m-month":["f-month","e-month"],"m-cust":["f-cust","e-cust"],"m-total":["f-total","e-total"]}; if(map[t.id]) setErr(map[t.id][0],map[t.id][1],"",t.id); if(t.closest("#m-parts")||t.id==="m-total") setErr("f-spend","e-spend",""); }
  if(t.id==="a-due") setErr("f-due","e-due","","a-due");
});
document.addEventListener("focusout",e=>{
  const t=e.target; if(!t.matches) return;
  // Validação no blur sem redesenhar a tela, para o próximo clique não cair fora do lugar.
  if(t.id==="b-phone"&&t.value&&!validPhone(t.value)) brandErr("phone","Telefone incompleto. Use (11) 91234-5678 ou (11) 1234-5678.");
  if(t.id==="b-email"&&t.value&&!validEmail(t.value)) brandErr("email","E-mail inválido. Use o formato voce@empresa.com.br.");
  if(t.id==="b-site"&&t.value&&!validSite(t.value)) brandErr("site","Site inválido. Use o formato empresa.com.br.");
  if(t.id==="a-due"&&t.value&&!parseDateBR(t.value)) setErr("f-due","e-due","Data inválida. Use DD/MM/AAAA, por exemplo 15/11/2026.","a-due");
});

/* ============ Eventos ============ */
document.addEventListener("change",e=>{
  const t=e.target; const k=t.dataset.change; if(!k) return;
  if(k==="status"){ const a=findAction(t.dataset.diag,t.dataset.key); const before=a.status; a.status=t.value; render();
    toast(`"${ACTIONS[a.key].title}" agora está ${STATUS[a.status].toLowerCase()}.`,()=>{ a.status=before; render(); }); }
  else if(k==="rep-diag"){ const R=currentRep(); R.diag=t.value; S.reprint=1; render(); }
  else if(k==="rep-from"){ const R=currentRep(); R.from=t.value; S.reprint=1; if(diagById(R.to).date<=diagById(R.from).date) R.to=diagsOf(R.co).find(d=>d.date>diagById(R.from).date).id; render(); }
  else if(k==="rep-to"){ const R=currentRep(); R.to=t.value; S.reprint=1; if(diagById(R.from).date>=diagById(R.to).date) R.from=diagsOf(R.co).filter(d=>d.date<diagById(R.to).date).pop().id; render(); }
  else if(k==="rep-answers"){ const R=currentRep(); R.answers=t.checked; S.reprint=t.checked?99:3; render(); }
  else if(k==="reeval"){ S.reevalDays=+t.value; toast(`Lembrete a cada ${t.value} dias.`); render(); }
  else if(k==="mode"){ setMode(t.value); }
  else if(k==="total-only"){ $("#m-parts").hidden=t.checked; $("#f-total").hidden=!t.checked; setErr("f-spend","e-spend",""); }
  else if(k==="logo"){ handleLogo(t.files&&t.files[0]); t.value=""; }
  else if(k==="cq-answer"){ CQ.answers[CQ.block]=+t.value; }
  else if(k==="cq-unknown"){ CQ.spendUnknown=t.checked; if(t.checked){ CQ.spend=""; CQ.err=""; } render(); }
});
document.addEventListener("submit",e=>{
  e.preventDefault(); const f=e.target;
  if(f.id==="brand-form"){
    const B=S.brandForm; const er={};
    if(B.phone&&!validPhone(B.phone)) er.phone="Telefone incompleto. Use (11) 91234-5678 ou (11) 1234-5678.";
    if(B.email&&!validEmail(B.email)) er.email="E-mail inválido. Use o formato voce@empresa.com.br.";
    if(B.site&&!validSite(B.site)) er.site="Site inválido. Use o formato empresa.com.br.";
    B.errors=er; if(Object.keys(er).length){ render(); const first=$(".field.has-error input"); if(first) first.focus(); return; }
    S.brand={name:B.name.trim(),logo:B.logo,logoInfo:B.logoInfo,phone:B.phone,email:B.email.trim(),site:B.site.trim()}; render(); toast("Marca salva. Os próximos PDFs saem com ela.");
  }
  if(f.id==="act-form"){
    const v=$("#a-due").value.trim(); let due=null;
    if(v){ due=parseDateBR(v); if(!due){ setErr("f-due","e-due","Data inválida. Use DD/MM/AAAA, por exemplo 15/11/2026.","a-due"); $("#a-due").focus(); return; } }
    const a=findAction(S.dlgCtx.diagId,S.dlgCtx.key); a.due=due; a.role=$("#a-role").value||null; a.note=$("#a-note").value.trim();
    closeDialog(); render(); toast("Ação atualizada.");
  }
  if(f.id==="month-form"){
    const ctx=S.dlgCtx; let ok=true; const mv=$("#m-month").value; const mm=/^(\d{2})\/(\d{4})$/.exec(mv); let ym=null;
    if(!mm||+mm[1]<1||+mm[1]>12){ setErr("f-month","e-month","Mês inválido. Use MM/AAAA, por exemplo 10/2026.","m-month"); ok=false; }
    else { ym=mm[2]+"-"+mm[1]; if(ym>"2026-10"||ym<"2020-01"){ setErr("f-month","e-month","Use um mês entre 01/2020 e 10/2026.","m-month"); ok=false; }
      else if(!ctx.edit&&(S.diary[ctx.coId]||[]).some(m=>m.month===ym)){ setErr("f-month","e-month",cap(monthLong(ym))+" já está anotado. Edite o mês na lista.","m-month"); ok=false; } }
    const cv=$("#m-cust").value; if(cv===""){ setErr("f-cust","e-cust","Informe quantos clientes novos vieram. Pode ser 0.","m-cust"); ok=false; }
    const totalOnly=$("#m-total-only").checked; let parts=null,total=null;
    if(totalOnly){ const tv=$("#m-total").value; if(!tv){ setErr("f-total","e-total","Informe o gasto total do mês. Pode ser 0,00.","m-total"); ok=false; } else total=parseMoney(tv); }
    else { parts={}; let any=false; PARTS.forEach(([k])=>{ const v=$("#m-"+k).value; if(v) any=true; parts[k]=parseMoney(v); }); if(!any){ setErr("f-spend","e-spend","Preencha pelo menos uma parte do gasto, ou marque \"Só sei o total\"."); ok=false; } }
    if(!ok){ const fe=$("#month-form [aria-invalid='true'], #month-form .has-error input"); if(fe) fe.focus(); return; }
    const entry={month:ym,parts,total,customers:+cv}; const list=S.diary[ctx.coId]||(S.diary[ctx.coId]=[]);
    if(ctx.edit){ const i=list.findIndex(m=>m.month===ctx.edit); list[i]=entry; } else list.push(entry);
    closeDialog(); render(); const c=monthCac(entry);
    toast(`${cap(monthLong(ym))} ${ctx.edit?"atualizado":"anotado"}. ${c==null?"Sem clientes novos, o custo por cliente deste mês não é calculado.":"Custo por cliente: "+money(c)+"."}`);
  }
});
function setMode(m){ if(S.mode===m) return; S.mode=m; toast(m==="owner"?"Modo minha empresa: o app mostra só a empresa em foco.":"Modo consultoria: todas as empresas cadastradas aparecem na carteira."); const r=route(); if(r.parts[0]==="empresas"||r.parts[0]==="relatorios"||r.parts[0]==="inicio") go("#/inicio"); else render(); }
function handleLogo(file){
  const B=S.brandForm; if(!file) return;
  if(!/^image\/(png|jpeg)$/.test(file.type)){ B.errors.logo="Use uma imagem PNG ou JPG. Arquivos "+(file.name.split(".").pop()||"").toUpperCase()+" não são aceitos."; render(); return; }
  if(file.size>2*1024*1024){ B.errors.logo="A imagem tem "+(file.size/1048576).toLocaleString("pt-BR",{maximumFractionDigits:1})+" MB. O limite é 2 MB."; render(); return; }
  const rd=new FileReader(); rd.onload=()=>{ const img=new Image(); img.onload=()=>{ const sc=Math.min(1,600/Math.max(img.width,img.height)); const cv=document.createElement("canvas"); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); B.logo=cv.toDataURL("image/png"); B.logoInfo=sc<1?`Reduzida para ${cv.width} × ${cv.height} px.`:`Mantida em ${cv.width} × ${cv.height} px.`; B.errors.logo=""; render(); toast("Logo carregada. Clique em Salvar marca para usar."); }; img.src=rd.result; }; rd.readAsDataURL(file);
}
function exampleLogo(){ const cv=document.createElement("canvas"); cv.width=480; cv.height=160; const g=cv.getContext("2d"); g.fillStyle="#fffdf7"; g.fillRect(0,0,480,160); g.fillStyle="#55692a"; g.beginPath(); g.arc(80,80,52,0,Math.PI*2); g.fill(); g.fillStyle="#fffdf7"; g.font="700 54px Georgia"; g.textAlign="center"; g.textBaseline="middle"; g.fillText("R",80,84); g.fillStyle="#1c1710"; g.textAlign="left"; g.font="700 50px Inter, Segoe UI, sans-serif"; g.fillText("Rumo",150,70); g.fillStyle="#6b6252"; g.font="500 24px Inter, Segoe UI, sans-serif"; g.fillText("CONSULTORIA",152,116); return cv.toDataURL("image/png"); }

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return; const act=el.dataset.act;
  if(act==="scrim-close"){ if(e.target===el) closeDialog(); return; }
  if(el.getAttribute("aria-disabled")==="true"){ e.preventDefault(); toast("A evolução precisa de 2 diagnósticos concluídos da mesma empresa."); return; }
  switch(act){
    case "toggle-theme": S.theme=S.theme==="dark"?"light":"dark"; document.documentElement.dataset.theme=S.theme; break;
    case "toggle-mode": setMode(S.mode==="owner"?"consultant":"owner"); break;
    case "tour-open": startTour(); break;
    case "tour-next": stepTour(1); break;
    case "tour-back": stepTour(-1); break;
    case "tour-end": endTour(); break;
    case "new-diagnosis": toast("No app, abre o questionário (já existe na versão atual)."); break;
    case "review-draft": closeDialog(true); toast("No app, abre o rascunho no questionário para revisar e concluir."); break;
    case "toast": toast(el.dataset.msg); break;
    case "rep-type": { const R=currentRep(); if(R.type!==el.dataset.type){ R.type=el.dataset.type; S.reprint=0; } render(); break; }
    case "export": openExport(); break;
    case "export-diag": { const d=diagById(el.dataset.diag); const R=reportState(d.co,{q:{diag:d.id}}); R.type="diag"; R.diag=d.id; openExport(undefined,R); break; }
    case "export-go": runExport(route().q.state==="error"&&el.dataset.fail!=="0"); break;
    case "open-pdf": toast("Abrindo o PDF no leitor do computador…"); closeDialog(); render(); break;
    case "show-folder": toast("Abrindo a pasta Downloads…"); break;
    case "dlg-cancel": closeDialog(); break;
    case "dlg-done": closeDialog(); render(); break;
    case "dlg-confirm": { const fn=S.dlgCtx&&S.dlgCtx.onConfirm; closeDialog(true); if(fn) fn(); break; }
    case "edit-action": openEditAction(el.dataset.diag,el.dataset.key); break;
    case "add-month": openMonth(el.dataset.co); break;
    case "edit-month": openMonth(el.dataset.co,el.dataset.month); break;
    case "delete-month": { const coId=el.dataset.co, m=el.dataset.month;
      confirmDialog({title:`Excluir ${monthLong(m)} do diário?`,consequence:"O custo por cliente desse mês sai da média e do próximo diagnóstico. Não dá para desfazer.",verb:"Excluir mês",danger:true,onConfirm:()=>{ S.diary[coId]=S.diary[coId].filter(x=>x.month!==m); render(); toast(cap(monthLong(m))+" excluído do diário."); }}); break; }
    case "remove-logo": confirmDialog({title:"Remover a logo?",consequence:"Os próximos PDFs saem só com o nome de quem entrega. Você pode escolher outra imagem depois.",verb:"Remover logo",danger:true,onConfirm:()=>{ S.brandForm.logo=null; S.brandForm.logoInfo=""; S.brand.logo=null; render(); toast("Logo removida."); }}); break;
    case "reset-brand": confirmDialog({title:"Voltar para a marca FitPulse?",consequence:"Nome, logo e contato serão apagados. Os próximos PDFs saem com a marca FitPulse. Não dá para desfazer.",verb:"Apagar a marca",danger:true,onConfirm:()=>{ S.brand={name:"",logo:null,logoInfo:"",phone:"",email:"",site:""}; S.brandForm={...S.brand,errors:{}}; render(); toast("Marca apagada. Os PDFs voltam a sair com a marca FitPulse."); }}); break;
    case "brand-example": S.brandForm={...S.brandForm,name:"Rumo Consultoria",phone:"(11) 98877-6655",email:"marina@rumoconsultoria.com.br",site:"rumoconsultoria.com.br",logo:exampleLogo(),logoInfo:"Logo de exemplo, 480 × 160 px.",errors:{}}; render(); toast("Exemplo preenchido. Clique em Salvar marca."); break;
    case "demo-logo": S.brandForm.logo=exampleLogo(); S.brandForm.logoInfo="Logo de exemplo, 480 × 160 px."; S.brandForm.errors.logo=""; render(); break;
    case "demo-logo-big": S.brandForm.errors.logo="A imagem tem 3,4 MB. O limite é 2 MB."; render(); break;
    case "demo-logo-svg": S.brandForm.errors.logo="Use uma imagem PNG ou JPG. Arquivos SVG não são aceitos."; render(); break;
    case "send-questionnaire": openSend(el.dataset.co); break;
    case "copy-msg": { const v=$("#send-msg").value; try{ navigator.clipboard.writeText(v).then(()=>toast("Mensagem copiada."),()=>toast("Selecione o texto e copie com Ctrl+C.")); }catch(_){ toast("Selecione o texto e copie com Ctrl+C."); } break; }
    case "send-go": { const coId=S.dlgCtx.coId; const c=co(coId); closeDialog(true);
      openDialog(`<h2 id="dlg-title">Enviar questionário para ${esc(c.name)}</h2><div class="busy is-loading" aria-busy="true" role="status"><span class="spinner"></span>Gerando o arquivo…</div>`,{busy:true,state:"loading"});
      setTimeout(()=>{ S.dlgBusy=false; closeDialog(true); S.sent=S.sent.filter(s=>s.co!==coId).concat({co:coId,date:TODAY});
        openDialog(`<h2 id="dlg-title">Arquivo gerado</h2><div class="result-mark ok success-state" data-state="success">${I.check}<div><b>Salvo na pasta Downloads</b><span class="file-path">questionario-${slug(c.name)}.html</span><p class="soft" style="margin-top:6px">Mande o arquivo com a mensagem que você copiou. Quando o cliente devolver as respostas, use "Importar respostas".</p></div></div>
          <div class="dialog-actions"><button class="btn" data-act="dlg-done">Fechar</button><button class="btn" data-act="show-folder">${I.folder} Mostrar na pasta</button><a class="btn btn-primary" href="#/questionario-cliente" autofocus>Ver como o cliente vê</a></div>`,{state:"success"}); },700); break; }
    case "import-answers": openImport(el.dataset.co,"pick"); break;
    case "import-again": openImport(S.dlgCtx.coId,"pick"); break;
    case "import-pick": { const coId=S.dlgCtx.coId; const file=IMPORT_FILES[+el.dataset.i];
      if(S.drafts[coId]&&file.kind==="ok"&&file.co===coId){ closeDialog(true); confirmDialog({title:`Substituir o rascunho de ${esc(co(coId).name)}?`,consequence:"Já existe um rascunho em andamento. Ele será descartado e trocado pelas respostas deste arquivo. Não dá para desfazer.",verb:"Substituir rascunho",danger:true,onConfirm:()=>doImport(coId,file)}); }
      else doImport(coId,file); break; }
    case "cq-go": { const i=+el.dataset.i; CQ.block=Math.max(0,Math.min(CLIENT_BLOCKS.length,i)); render(); break; }
    case "cq-next": { if(CQ.block===0&&!CQ.spendUnknown&&!CQ.spend){ CQ.err="Informe o gasto do mês ou marque \"Não sei o valor exato\"."; render(); const i=$("#cq-spend"); if(i) i.focus(); return; } CQ.block++; render(); break; }
    case "cq-save": CQ.saving=true; render(); setTimeout(()=>{ CQ.saving=false; CQ.saved=true; render(); },800); break;
  }
});

  {route:"#/empresa/c1/relatorios",sel:'[data-aioson-tour="relatorios"]',title:"Relatórios em PDF",text:"Esta é a prévia do PDF, página por página: capa, resumo, gráfico das 8 dimensões e riscos. \"Exportar PDF\" salva na pasta Downloads e deixa abrir o arquivo na hora."},
  {route:"#/configuracoes",sel:'[data-aioson-tour="marca"]',title:"A sua marca no relatório",text:"Coloque nome, logo e contato de quem entrega. Eles saem na capa e no rodapé de todo PDF. Em branco, o PDF sai com a marca FitPulse."},
  {route:"#/empresa/c1/acoes",sel:'[data-aioson-tour="acoes"]',title:"Acompanhar as 3 ações",text:"Marque o andamento de cada ação, com prazo e responsável. O app mostra o que venceu e quantos dias faltam para refazer o diagnóstico."},
  {route:"#/empresa/c1/diario",sel:'[data-aioson-tour="diario"]',title:"Diário de números",text:"Anote todo mês o gasto para atrair clientes e quantos clientes novos vieram. Com 3 meses, o custo por cliente vira um número medido no próximo diagnóstico."},
  {route:null,sel:'[data-aioson-tour="modo"]',title:"Modo consultoria",text:"Quem atende várias empresas troca o modo no topo ou em Configurações. Ganha o relatório da carteira e o questionário à distância, que o cliente responde no computador dele."}
];
function startTour(){ S.tourStep=0; showTourStep(); }
function endTour(){ S.tourStep=null; $("#tour-root").innerHTML=""; document.querySelectorAll(".tour-target").forEach(x=>x.classList.remove("tour-target")); try{ sessionStorage.setItem("fp-tour-seen","1"); }catch(_){} }
function stepTour(d){ S.tourStep=Math.max(0,Math.min(TOUR.length-1,S.tourStep+d)); showTourStep(); }
function showTourStep(){ const st=TOUR[S.tourStep]; if(st.route&&location.hash!==st.route){ location.hash=st.route; } else { render(); } }
function positionTour(){
  const st=TOUR[S.tourStep]; document.querySelectorAll(".tour-target").forEach(x=>x.classList.remove("tour-target"));
  let t=document.querySelector(st.sel); if(t&&getComputedStyle(t).display==="none") t=null;
  if(t){ t.classList.add("tour-target"); t.scrollIntoView({block:"nearest"}); }
  $("#tour-root").innerHTML=`<div class="tour-veil" data-act="tour-end"></div><div class="tour-pop" role="dialog" aria-modal="true" aria-labelledby="tour-title"><h2 id="tour-title">${st.title}</h2><p>${st.text}</p><p class="step">PASSO ${S.tourStep+1} DE ${TOUR.length}</p>
    <div class="dialog-actions"><button class="btn btn-text" data-act="tour-end">Pular</button>${S.tourStep?'<button class="btn" data-act="tour-back">Voltar</button>':""}<button class="btn btn-primary" data-act="${S.tourStep===TOUR.length-1?"tour-end":"tour-next"}" data-aioson-id="tour-next">${S.tourStep===TOUR.length-1?"Entendi":"Próximo"}</button></div></div>`;
  const pop=$(".tour-pop"); const vw=innerWidth, vh=innerHeight;
  if(t){ const rc=t.getBoundingClientRect(); let top=rc.bottom+14; if(top+pop.offsetHeight>vh-12) top=Math.max(12,rc.top-pop.offsetHeight-14); if(top<12||vw<640) top=vh-pop.offsetHeight-16; let left=Math.min(Math.max(16,rc.left),vw-pop.offsetWidth-16); pop.style.top=top+"px"; pop.style.left=left+"px"; }
  else { pop.style.top=(vh-pop.offsetHeight)/2+"px"; pop.style.left=(vw-pop.offsetWidth)/2+"px"; }
  const nb=pop.querySelector('[data-aioson-id="tour-next"]'); if(nb) nb.focus();
}

/* ============ Início ============ */
document.documentElement.dataset.theme=S.theme;
if(!location.hash) location.replace("#/empresa/c1/relatorios");
render();
(function(){ let seen=false; try{ seen=sessionStorage.getItem("fp-tour-seen")==="1"; }catch(_){} const r=route(); if(!seen&&!r.q.state&&!r.q.tour&&r.parts[0]!=="questionario-cliente") startTour(); })();
</script>
